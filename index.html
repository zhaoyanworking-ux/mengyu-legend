function canvasTex(draw, size, repeatX, repeatY, nearest){
  const S=size||256;
  const c=document.createElement("canvas"); c.width=c.height=S;
  draw(c.getContext("2d"), S);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=isMobile?1:4;
  t.repeat.set(repeatX||1, repeatY||1);
  if(nearest){ t.minFilter=t.magFilter=THREE.LinearFilter; }
  t.needsUpdate=true;
  return t;
}
function makeGradientMap(){
  const c=document.createElement("canvas"); c.width=8; c.height=1;
  const g=c.getContext("2d");
  const im=g.createImageData(8,1);
  // stronger cel bands so software-GL still reads shadow / mid / light
  const stops=[[96,78,88],[124,104,108],[158,138,128],[190,172,158],[214,200,186],[232,222,210],[246,240,232],[255,252,246]];
  for(let i=0;i<8;i++){ im.data[i*4]=stops[i][0]; im.data[i*4+1]=stops[i][1]; im.data[i*4+2]=stops[i][2]; im.data[i*4+3]=255; }
  g.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.NoColorSpace;
  t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false;
  return t;
}
function toon(color, map, opts){
  const o={ color:new THREE.Color(color), gradientMap, ...opts };
  if(map) o.map=map;
  const m=new THREE.MeshToonMaterial(o);
  return m;
}
function addOutline(mesh, width){
  const mat=new THREE.MeshBasicMaterial({ color:0x3a2a32, side:THREE.BackSide });
  const ol=new THREE.Mesh(mesh.geometry, mat);
  const w=width||0.035;
  ol.scale.setScalar(1+w);
  ol.renderOrder=-1;
  mesh.add(ol);
  return mesh;
}
const geo={
  sphere: new THREE.SphereGeometry(0.5, 22, 18),
  sphereH: new THREE.SphereGeometry(0.5, 28, 22),
  sphereL: new THREE.SphereGeometry(0.5, 12, 10),
  cap: new THREE.CapsuleGeometry(0.5, 0.85, 8, 14),
  box: new THREE.BoxGeometry(1,1,1),
  cyl: new THREE.CylinderGeometry(0.5,0.5,1,14),
  cone: new THREE.ConeGeometry(0.5,1,12),
  plane: new THREE.PlaneGeometry(1,1),
  circle: new THREE.CircleGeometry(0.5, 24)
};
(function(){
  // SphereGeometry front is at U=0.25; shift so a centered face texture looks forward (+Z)
  function faceSphere(w,h){
    const g=new THREE.SphereGeometry(0.5, w||28, h||22);
    const uv=g.attributes.uv;
    for(let i=0;i<uv.count;i++) uv.setX(i, (uv.getX(i)+0.25)%1);
    return g;
  }
  geo.sphereF=faceSphere(28,22);
})();
function mesh(geometry, material, x,y,z, sx,sy,sz, parent, outlineW, shadows){
  const m=new THREE.Mesh(geometry, material);
  m.position.set(x||0,y||0,z||0);
  // uniform-scale shorthand: mesh(geo, mat, x,y,z, s, parent, outlineW, shadows)
  if(sy && sy.isObject3D){ shadows=outlineW; outlineW=sz; parent=sy; sy=sx; sz=sx; }
  if(sx!=null) m.scale.set(sx, sy==null?sx:sy, sz==null?sx:sz);
  m.castShadow=!!shadows; m.receiveShadow=!!shadows;
  if(outlineW!==0) addOutline(m, outlineW==null?0.03:outlineW);
  (parent||scene).add(m);
  return m;
}
function blobShadow(parent, s){
  const m=new THREE.Mesh(new THREE.CircleGeometry(s||0.5, 16),
    new THREE.MeshBasicMaterial({color:0x3a4a2e, transparent:true, opacity:0.22, depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.y=0.015;
  parent.add(m); return m;
}

function prepGlb(id, gltf){
  const root=gltf.scene;

  const h=Math.max(0.01, box.max.y-box.min.y);
  const skinned=[];
  root.traverse(o=>{
    if(!o.isMesh) return;
    const old=o.material;
    o.material=new THREE.MeshToonMaterial({ color:0xffffff, map:old.map||null, normalMap:old.normalMap||null, gradientMap,
      emissive:old.map?0xffffff:0x000000, emissiveMap:old.map||null, emissiveIntensity:0.22 });

    if(!o.geometry.attributes.normal) return;

    const ol=new THREE.SkinnedMesh(o.geometry, outlineMat(gh*0.006));

  });

  gltf.animations.forEach(c=>{ stripRootMotion(c); clips[c.name]=c; });

  if(src) clips.attack=cutClip(src, a.t0, Math.min(a.t1, src.duration), "attack");

}
function makeGlbChar(id){
  const d=GLB.data[id]; if(!d || !window.THREE_ADDONS) return null;

  const s=GLB.height/d.srcH;
  inner.scale.setScalar(s); inner.position.y=-d.minY*s; inner.rotation.y=GLB.yawFix;
  g.add(inner);
  const mixer=new THREE.AnimationMixer(inner);
  const acts={};
  ["idle","run","attack"].forEach(k=>{ if(d.clips[k]) acts[k]=mixer.clipAction(d.clips[k]); });
  if(acts.attack){ acts.attack.setLoop(THREE.LoopOnce,1); acts.attack.clampWhenFinished=true; }
  if(acts.run) acts.run.setEffectiveTimeScale(1.25);
  if(acts.idle){ acts.idle.play(); acts.idle.time=Math.random()*3; }
  mixer.update(0);
  g.userData={ gltf:true, kind:id, mixer, acts, cur:"idle", atkUntil:0, atkLen:d.clips.attack?d.clips.attack.duration:0.5, phase:0 };

function glbFadeTo(u, name, dur){
  const next=u.acts[name], prev=u.acts[u.cur];

  next.reset(); next.setEffectiveWeight(1); next.play();
  if(name==="run") next.setEffectiveTimeScale(1.25);
  if(prev) next.crossFadeFrom(prev, dur, false);
  u.cur=name;
}
function playAttack(ch, dur){
  const u=ch&&ch.userData; if(!u||!u.gltf||!u.acts.attack) return;
  const a=u.acts.attack, prev=u.acts[u.cur];
  dur=dur||0.3;
  a.reset(); a.setEffectiveWeight(1); a.setEffectiveTimeScale(u.atkLen/dur); a.play();
  if(prev && prev!==a) a.crossFadeFrom(prev, 0.05, false);
  u.cur="attack"; u.atkUntil=performance.now()/1000+dur;
}
function animGlb(ch, moving, dt, attacking, spinning, dead){
  const u=ch.userData, now=performance.now()/1000;
  if(spinning && (u.cur!=="attack" || now>=u.atkUntil)) playAttack(ch, 0.24);
  const atkLive=u.cur==="attack" && now<u.atkUntil+0.06;
  if(!atkLive && !spinning){
    const want=(!dead && moving)?"run":"idle";
    if(want!==u.cur) glbFadeTo(u, want, u.cur==="attack"?0.12:0.18);
  }
  u.mixer.update(dt);
  ch.position.y=(u.groundY||0);
  const uni=u.uniScale||1;
  if(!dead) ch.scale.setScalar(uni);
  if(spinning) ch.rotation.y += dt*12;
  if(dead){
    ch.scale.y=Math.max(0.12*uni, ch.scale.y-dt*1.6);
    ch.scale.x=Math.min(1.8*uni, ch.scale.x+dt);
    ch.scale.z=ch.scale.x;
  }
}

function loadCharacterModels(onDone){
  window.__modelsDone=false;
  const bar=$("loadbar"), fill=$("loadfill"), txt=$("loadtxt");
  if(!window.THREE_ADDONS){ window.__modelsDone=true; if(onDone) onDone(); return; }
  // match the procedural chibi height so NPCs / props stay in proportion
  try{ const ref=makeSwordsman(); ref.updateMatrixWorld(true); const b=new THREE.Box3().setFromObject(ref); GLB.height=Math.max(1.2,(b.max.y-b.min.y)*1.08); }catch(e){}
  const ids=Object.keys(GLB_FILES), prog={}; let left=ids.length;
  const upd=()=>{ let s=0; ids.forEach(i=>s+=(prog[i]||0)); const p=Math.round(s/ids.length*100); fill.style.width=p+"%"; txt.textContent="角色模型加载中 "+p+"%"; };
  const loader=new THREE_ADDONS.GLTFLoader();
  loader.setMeshoptDecoder(THREE_ADDONS.MeshoptDecoder);
  bar.style.display="block"; upd();
  function fin(){
    if(--left>0) return;
    fill.style.width="100%";
    setTimeout(()=>{ bar.style.display="none"; }, 350);
    window.__modelsDone=true; if(onDone) onDone();
  }
  const fromFile=location.protocol==="file:";
  ids.forEach(id=>{
    if(fromFile){
      // file:// cannot fetch(); load a base64 copy through a plain <script> tag instead
      const sc=document.createElement("script"); sc.src=GLB_FILES[id]+".js";
      sc.onload=()=>{
        try{
          const bin=atob((window.__GLB_B64||{})[id]||""); const buf=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
          loader.parse(buf.buffer, "", g=>{ try{ prepGlb(id,g); }catch(e){ console.warn("GLB prep failed", id, e); delete GLB.data[id]; } prog[id]=1; upd(); fin(); },
            err=>{ console.warn("GLB parse failed, using procedural", id, err); prog[id]=1; upd(); fin(); });
        }catch(e){ console.warn("GLB decode failed", id, e); prog[id]=1; upd(); fin(); }
      };
      sc.onerror=()=>{ console.warn("GLB script missing, using procedural", id); prog[id]=1; upd(); fin(); };
      document.head.appendChild(sc); return;
    }
    loader.load(GLB_FILES[id],
      g=>{ try{ prepGlb(id,g); }catch(e){ console.warn("GLB prep failed, using procedural", id, e); delete GLB.data[id]; } prog[id]=1; upd(); fin(); },
      e=>{ if(e && e.total){ prog[id]=Math.min(0.95, e.loaded/e.total); upd(); } },
      err=>{ console.warn("GLB load failed, using procedural", id, err && err.message); prog[id]=1; upd(); fin(); });
  });
}
function cardThumbs(){
  // render each GLB once into a small sRGB target and drop the image into its class card
  const W=200, H=240;
  const rt=new THREE.WebGLRenderTarget(W,H,{ samples:0 }); rt.texture.colorSpace=THREE.SRGBColorSpace;
  const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xe8f4ff, 0x8aa070, 1.25));
  const dl=new THREE.DirectionalLight(0xfff4dc, 1.6); dl.position.set(1.5,3,4); sc.add(dl);
  const cam=new THREE.PerspectiveCamera(30, W/H, 0.05, 50);
  const buf=new Uint8Array(W*H*4);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const cx=cv.getContext("2d");
  CLASS_ORDER.forEach(id=>{
    if(!glbReady(id)) return;
    const card=document.querySelector('.card[data-id="'+id+'"]'); if(!card) return;
    const m=makeGlbChar(id); m.rotation.y=0.35; sc.add(m);
    m.updateMatrixWorld(true);
    const hgt=GLB.height;
    cam.position.set(0, hgt*0.55, hgt*2.35); cam.lookAt(0, hgt*0.5, 0);
    const prevT=renderer.getRenderTarget(), prevC=renderer.getClearColor(new THREE.Color()), prevA=renderer.getClearAlpha();
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(sc, cam);
    renderer.readRenderTargetPixels(rt, 0,0,W,H, buf);
    renderer.setRenderTarget(prevT); renderer.setClearColor(prevC, prevA);
    sc.remove(m);
    const im=cx.createImageData(W,H);
    for(let y=0;y<H;y++){ im.data.set(buf.subarray((H-1-y)*W*4, (H-y)*W*4), y*W*4); }
    cx.putImageData(im,0,0);
    let img=card.querySelector("img.thumb");
    if(!img){ img=document.createElement("img"); img.className="thumb"; img.alt=CLASSES[id].name; card.insertBefore(img, card.firstChild); }
    img.src=cv.toDataURL("image/png");
  });
  rt.dispose();
}
function upgradeVisuals(){
  // swap already-spawned procedural chibis for GLB ones once loading finishes
  function swap(old){
    const id=old.userData && old.userData.kind; if(!glbReady(id) || old.userData.gltf) return old;
    const n=makeGlbChar(id); n.position.copy(old.position); n.rotation.copy(old.rotation);
    n.userData.uniScale=old.userData.uniScale||1; n.scale.setScalar(n.userData.uniScale);
    if(old.parent){ old.parent.add(n); old.parent.remove(old); }
    return n;
  }
  if(G.player) G.player=swap(G.player);
  if(G._lineup) G._lineup=G._lineup.map(swap);
  if(G._cast) G._cast=G._cast.map(swap);
}

function limb(parent, color, x,y,z, sx,sy,sz){
  // group pivot at the shoulder / hip so children (hands, weapons) are not crushed by mesh scale
  const g=new THREE.Group();
  g.position.set(x,y,z);

  return g;
}

}

function makeSlime(bodyColor, iris, scale, angry){
  const g=new THREE.Group();
  const col=new THREE.Color(bodyColor);
  // face texture filled with body color so the sphere stays solid
  const ft=canvasTex((ctx,S)=>{
    ctx.fillStyle=`rgb(${col.r*255|0},${col.g*255|0},${col.b*255|0})`;
    ctx.fillRect(0,0,S,S);
    function eye(cx,cy){
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.ellipse(cx,cy,46,54,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=iris||"#2a1c28";
      ctx.beginPath(); ctx.ellipse(cx,cy+8,26,30,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#1a1220";
      ctx.beginPath(); ctx.ellipse(cx,cy+10,12,15,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(cx-10,cy-4,10,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+8,cy+8,4,0,Math.PI*2); ctx.fill();
      if(angry){
        ctx.strokeStyle="#2a1020"; ctx.lineWidth=8; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(cx-44,cy-36); ctx.lineTo(cx+8,cy-16); ctx.stroke();
      }
    }
    const cy=S*0.47, dx=S*0.12;
    eye(S*0.5-dx,cy); eye(S*0.5+dx,cy);
    ctx.fillStyle="rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(S*0.35,S*0.28,40,22, -0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,140,160,0.28)";
    ctx.beginPath(); ctx.ellipse(S*0.5-88,S*0.6,22,12,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(S*0.5+88,S*0.6,22,12,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba(80,30,50,0.45)"; ctx.lineWidth=5; ctx.lineCap="round";
    if(angry){ ctx.beginPath(); ctx.arc(S*0.5,S*0.70,16,1.1*Math.PI,1.9*Math.PI); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(S*0.5,S*0.61,20,0.2*Math.PI,0.8*Math.PI); ctx.stroke(); }
  }, 512, 1, 1);
  const body=mesh(geo.sphereF, toon(0xffffff, ft), 0, 0.42, 0, 1.15, 0.88, 1.08, g, 0.04, true);
  // shine highlight blob
  mesh(geo.sphere, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45 }), -0.22, 0.18, 0.28, 0.28, 0.18, 0.16, body, 0, false);
  g.userData={ body, head:body, phase:Math.random()*10, kind:"slime", baseY:0.42, uniScale:(scale||1) };
  blobShadow(g, 0.48);
  g.scale.setScalar(scale||1);
  return g;
}

function animBob(ch, moving, dt, attacking, spinning, dead){
  if(ch.userData && ch.userData.gltf){ animGlb(ch, moving, dt, attacking, spinning, dead); return; }
  const u=ch.userData; if(!u||!u.body) return;
  u.phase=(u.phase||0)+dt*(moving?11:2.4);
  const s=Math.sin(u.phase);
  // squash & stretch
  if(!dead && u.kind==="slime"||u.kind==="boss"){
    const sq=1+s*0.10;
    const base=ch.scale.x||1; // keep uniform boss scale-ish
  }
  if(!dead){
    const bob=moving?Math.abs(s)*0.05:s*0.025;
    if(u.body && u.kind!=="slime" && u.kind!=="boss"){
      // slight body bob already in group
    }
    ch.position.y = (ch.userData.groundY||0) + (moving?Math.abs(s)*0.06:s*0.03);
    const squash=1 + (moving?Math.abs(s):s)*((u.kind==='slime'||u.kind==='boss')?0.02:0.04);
    const uni=ch.userData.uniScale||1;
    ch.scale.set(uni*(2-squash), uni*squash, uni*(2-squash));
    const sw=moving?Math.sin(u.phase)*0.5:Math.sin(u.phase*0.5)*0.08;
    if(u.armL){ u.armL.rotation.x= attacking? -1.05 : (moving?sw:-0.35); u.armL.rotation.z=0.35; }
    if(u.armR){ u.armR.rotation.x= attacking? -1.45 : (moving?-sw:-0.55); u.armR.rotation.z=-0.22; }
    if(u.legL) u.legL.rotation.x=-sw*0.85;
    if(u.legR) u.legR.rotation.x= sw*0.85;
  }
  if(spinning) ch.rotation.y += dt*12;
  if(dead){
    ch.scale.y=Math.max(0.12, ch.scale.y-dt*1.6);
    ch.scale.x=Math.min(1.8*(ch.userData.uniScale||1), ch.scale.x+dt);
    ch.scale.z=ch.scale.x;
  }
}

function scatterFlowers(){
  const cols=[0xfff8f0,0xffb3c8,0xffe08a,0xb8d8ff,0xffffff,0xe0b8ff];
  const geoS=new THREE.SphereGeometry(0.16, 8, 6);
  const max=isMobile?110:220;
  cols.forEach((col,ci)=>{
    const im=new THREE.InstancedMesh(geoS, toon(col), Math.ceil(max/cols.length));
    im.castShadow=false; im.receiveShadow=false;
    let n=0, dummy=tmpO;
    for(let z=-16;z<=18 && n<im.count;z+=1.25){
      for(let x=-16;x<=16 && n<im.count;x+=1.25){
        const d=x*x+z*z; if(d<22) continue;
        if(Math.abs(x)<2.4 && z>1) continue;
        if((x+z+ci)%5!==ci%3) continue;
        dummy.position.set(x+((ci*0.3)%1.1), 0.14, z+((ci*0.47)%1.0));
        dummy.scale.setScalar(0.7+((x+z)&3)*0.15);
        dummy.rotation.set(0,0,0);
        dummy.updateMatrix();
        im.setMatrixAt(n++, dummy.matrix);
      }
    }
    im.count=n; scene.add(im);
  });
}

function tracked(){
  let ready=null, act=null, av=null;
  QUESTS.forEach(q=>{ const s=qst(q.id).st; if(s==="ready"&&!ready)ready=q; if(s==="active"&&!act)act=q; if(s==="avail"&&!av)av=q; });
  return ready||act||av;
}
function progressText(){
  const q=tracked(); if(!q) return G.save&&G.save.storyDone?"蚀雾暂时被推退了。在青岚镇走走吧。":"去古井广场找镇长苏晚晴。";
  const e=qst(q.id);
  const names={mayor:"苏晚晴",herb:"叶青",guard:"石川"};
  if(e.st==="avail") return "与「"+(names[q.giver]||"")+"」交谈。";
  if(e.st==="ready") return "向「"+(names[q.turn]||"")+"」复命。";
  if(q.type==="talk") return "去找「"+(names[q.target]||"")+"」。";
  if(q.type==="kill") return "击败蚀斑史莱姆  "+e.pr+" / "+q.count;
  if(q.type==="collect") return "收集蚀核碎片  "+e.pr+" / "+q.count;
  return q.journal;
}
function markerFor(npcId){
  let turn=false, av=false, talk=false;
  QUESTS.forEach(q=>{
    const s=qst(q.id).st;
    if(s==="ready"&&q.turn===npcId) turn=true;
    if(s==="avail"&&q.giver===npcId) av=true;
    if(s==="active"&&q.type==="talk"&&q.target===npcId) talk=true;
  });
  if(turn||talk) return "?";
  if(av) return "!";
  return "";
}
function makeMarker(){
  const c=document.createElement("canvas"); c.width=128;c.height=128;
  const ctx=c.getContext("2d");
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  sp.scale.set(0.7,0.7,1);
  sp._set=function(ch){
    ctx.clearRect(0,0,128,128);
    if(!ch){ sp.visible=false; return; }
    sp.visible=true;
    ctx.font="bold 96px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=10; ctx.strokeStyle="#3a2410"; ctx.strokeText(ch,64,72);
    ctx.fillStyle=ch==="!"?"#ffd84a":"#6be88a"; ctx.fillText(ch,64,72);
    tex.needsUpdate=true;
  };
  return sp;
}
function refreshMarkers(){
  G.npcs.forEach(n=>{ if(n.marker&&n.marker._set) n.marker._set(markerFor(n.id)); });
}
function notifyKill(){
  G.save.kills++;
  QUESTS.forEach(q=>{
    const e=qst(q.id);
    if(e.st==="active"&&q.type==="kill"){ e.pr=Math.min(q.count,e.pr+1); if(e.pr>=q.count) e.st="ready"; }
  });
  persist(G.save); refreshHUD();
}
function notifyCollect(){
  G.save.shards++;
  QUESTS.forEach(q=>{
    const e=qst(q.id);
    if(e.st==="active"&&q.type==="collect"){
      e.pr=Math.min(q.count,e.pr+1);
      if(e.pr>=q.count){ e.st="ready"; if(q.boss) spawnBoss(); }
    }
  });
  persist(G.save); refreshHUD();
}
function acceptQuest(q){ const e=qst(q.id); if(e.st!=="avail") return; e.st="active"; e.pr=0; persist(G.save); toast("接受任务："+q.title); refreshHUD(); }
function turnIn(q){
  const e=qst(q.id); if(e.st!=="ready") return;
  e.st="done"; e.pr=q.count; G.save.gold+=q.gold; G.save.xp+=q.xp;
  if(q.next){ const n=qst(q.next); if(n.st==="locked") n.st="avail"; } else G.save.storyDone=true;
  persist(G.save); toast("完成："+q.title+"  +"+q.gold+" 金  +"+q.xp+" 经验"); refreshHUD();
}

function spawnPlayerVisual(classId){
  if(G.player) scene.remove(G.player);
  G.player = makeClassVisual(classId);
  G.player.userData.uniScale=1;
  scene.add(G.player);
  G.player.position.set(G.p.x,0,G.p.z);
}
function spawnNpcVisuals(){
  G.npcs=[];
  Object.values(NPCS).forEach(d=>{
    const m=makeNpc(d.kind);
    m.position.set(d.x,0,d.z); m.rotation.y=d.yaw; scene.add(m);
    const mk=makeMarker(); m.add(mk); mk.position.set(0,1.95,0);
    G.npcs.push({ id:d.id, name:d.name, mesh:m, marker:mk, x:d.x, z:d.z });
  });
}
function spawnSlime(x,z,boss){
  const colors=[[0xa06ad8,"#5A2080"],[0x5ab4ff,"#1A4A80"],[0x7be36a,"#1A4A20"]];
  const c=colors[Math.floor(Math.random()*3)];
  const m=boss?makeBoss():makeSlime(c[0], c[1], 1, false);
  m.position.set(x,0,z); scene.add(m);
  const e={ mesh:m, x, z, hp:boss?280:45, max:boss?280:45, boss, spd:boss?3.4:3.0, dmg:boss?16:8, cd:0, dead:false, kx:0, kz:0 };
  G.enemies.push(e); return e;
}
function spawnBoss(){
  if(G.bossSpawned) return;
  G.bossSpawned=true; spawnSlime(0,40,true); toast("雾石坡深处，蚀雾史莱姆显形了！");
}
function spawnShard(x,z){
  const m=mesh(geo.sphere, new THREE.MeshToonMaterial({ color:0xc45cff, gradientMap, emissive:0x8822cc, emissiveIntensity:0.5 }), x, 0.45, z, 0.32, scene, 0.02, false);
  G.pickups.push({ mesh:m, x, z, id:"shard" });
}

function startAdventure(classId, fresh){
  G.classId=classId;
  if(fresh || !G.save){ G.save=newSave(classId); persist(G.save); G.bossSpawned=false; }
  else { G.save.classId=classId; persist(G.save); }
  const c=CLASSES[classId];
  G.p={x:0,z:-3.2,y:0,yaw:0,vx:0,vz:0,hp:c.hp,mp:c.mp,dead:false,atkT:0,spinT:0,hitStop:0};
  G.skillCd=0; G.atkCd=0; G.mode="play"; G.paused=false; G.freezeCam=false;
  spawnPlayerVisual(classId);
  $("select").style.display="none"; $("playHud").style.display="block";
  $("atk").textContent=c.atkLabel;
  const sk=$("sk"); if(sk.childNodes[0]) sk.childNodes[0].textContent=c.skillLabel;
  $("over").style.display="none";
  refreshHUD(); toast("欢迎来到青岚镇，"+c.name);
}

function faceCam(m){
  const p=camera.position;
  m.lookAt(p.x, m.position.y, p.z);
}
function poseLineup(z, faceYaw){
  if(G._lineup){
    G._lineup.forEach(m=>scene.remove(m));
  }
  // when the camera looks toward +Z, world +X appears on the LEFT of the frame
  const sw=makeClassVisual("swordsman"), mg=makeClassVisual("mage"), ar=makeClassVisual("archer");
  sw.position.set(2.15,0,z); sw.rotation.y=faceYaw;
  mg.position.set(0.0,0,z+0.15); mg.rotation.y=faceYaw;
  ar.position.set(-2.20,0,z); ar.rotation.y=faceYaw;
  [sw,mg,ar].forEach(m=>scene.add(m));
  G._lineup=[sw,mg,ar];
  return G._lineup;
}
function applyShotCamera(){
  G.freezeCam=true;
  if(shot==="select"){
    // character-sheet pose: trio in a meadow, town cottages behind
    poseLineup(-13.5, Math.PI);
    (G._lineup||[]).forEach(m=>{ m.userData.uniScale=1.12; m.scale.setScalar(1.12); });
    camera.fov=36; camera.updateProjectionMatrix();
    camera.position.set(0.2, 2.15, -20.4);
    camera.lookAt(0, 0.95, -13.3);
    return;
  }
  // cinematic shots hide HUD so the scene can be compared to the concept art
  $("select").style.display="none";
  $("playHud").style.display="none";
  if(shot==="town"){
    // 3/4 aerial like the town concept; characters around the fountain on cobbles (not in water)
    // stand on the cobbles around the basin (radius ~3.2), not in the water
    G.p.x=-3.15; G.p.z=1.85; G.p.yaw=0.7;
    if(G.player){ G.player.position.set(-3.15,0,1.85); G.player.rotation.y=0.7; }
    if(!G._cast){
      const mage=makeClassVisual("mage"); mage.position.set(-1.15,0,3.35); mage.rotation.y=0.25; scene.add(mage);
      const arch=makeClassVisual("archer"); arch.position.set(3.15,0,1.95); arch.rotation.y=-0.55; scene.add(arch);
      const arch2=makeClassVisual("archer"); arch2.position.set(3.45,0,5.55); arch2.rotation.y=-0.9; scene.add(arch2);
      G._cast=[mage,arch,arch2];
    }
    camera.fov=36; camera.updateProjectionMatrix();
    camera.position.set(7.4, 11.6, -14.8);
    camera.lookAt(0, 0.35, 5.0);
  } else if(shot==="field"){
    spawnBoss();
    G.p.x=2; G.p.z=27.5; G.p.yaw=0.25;
    if(G.player){ G.player.position.set(2,0,27.5); G.player.rotation.y=0.25; }
    // pull a few slimes into frame
    const living=G.enemies.filter(e=>!e.dead);
    const spots=[[-1.2,30.5],[2.6,31.2],[-2.8,33.0],[4.2,32.4],[0.4,34.2]];
    living.forEach((e,i)=>{
      if(e.boss){ e.x=0.2; e.z=36.4; e.mesh.position.set(e.x,0,e.z); }
      else if(spots[i]){ e.x=spots[i][0]; e.z=spots[i][1]; e.mesh.position.set(e.x,0,e.z); }
      faceCam(e.mesh);
    });
    camera.position.set(8.6, 5.4, 22.8);
    camera.lookAt(0.6, 0.7, 32.5);
  } else if(shot==="combat"){
    spawnBoss();
    G.p.x=1.15; G.p.z=29.4; G.p.yaw=0.12;
    if(G.player){ G.player.position.set(1.15,0,29.4); G.player.rotation.y=0.12; }
    const living=G.enemies.filter(e=>!e.dead && !e.boss);
    if(living[0]){ living[0].x=2.35; living[0].z=31.0; living[0].mesh.position.set(2.35,0,31.0); }
    if(living[1]){ living[1].x=0.4; living[1].z=31.6; living[1].mesh.position.set(0.4,0,31.6); }
    const boss=G.enemies.find(e=>e.boss);
    if(boss){ boss.x=1.6; boss.z=34.2; boss.mesh.position.set(1.6,0,34.2); }
    G.enemies.forEach(e=>{ if(!e.dead) faceCam(e.mesh); });
    camera.position.set(5.4, 2.35, 25.6);
    camera.lookAt(1.9, 0.85, 31.0);
    slashArc(1.8, 30.6, 0.15);
    burst(2.4, 0.7, 31.2, 0xffe08a, 16);
    burst(2.1, 0.8, 30.8, 0xffffff, 8);
    dmgText(2.3, 31.1, 1.4, 22);
    dmgText(1.6, 31.6, 1.6, 18);
    G.p.atkT=0.45;
  }
}

function inTownBounds(x,z){
  if(x<-17||x>17||z<-17||z>46) return false;
  if(Math.abs(z-15.8)<0.7 && Math.abs(x)>1.8) return false;
  return true;
}
function tryAttack(){
  if(G.mode!=="play"||G.p.dead||G.paused) return;
  if(G.p.spinT>0) return;
  const c=CLASSES[G.classId];
  if(G.classId==="swordsman"){
    if(G.p.atkT>0 && G.combo<3 && performance.now()/1000<G.comboExp){ G.comboQueued=true; return; }
    if(G.p.atkT>0||G.atkCd>0) return;
    doMelee();
  } else {
    if(G.atkCd>0) return;
    G.atkCd=c.atkCd; G.p.atkT=0.25; playAttack(G.player, G.classId==="mage"?0.4:0.3);
    fireShot(G.classId==="mage", 0, c.atk, G.classId==="mage"?11:18);
  }
}
function doMelee(){
  const c=CLASSES[G.classId];
  G.combo=(G.combo||0)+1; if(G.combo>3) G.combo=1;
  G.p.atkT=0.28; G.comboExp=performance.now()/1000+0.42;
  let dmg=c.atk*(0.85+0.25*G.combo); if(G.combo===3) dmg*=1.25;
  const heavy=G.combo===3;
  playAttack(G.player, heavy?0.34:0.28);
  G.p.x+=Math.sin(G.p.yaw)*(heavy?0.4:0.22);
  G.p.z+=Math.cos(G.p.yaw)*(heavy?0.4:0.22);
  slashArc(G.p.x+Math.sin(G.p.yaw)*0.7, G.p.z+Math.cos(G.p.yaw)*0.7, G.p.yaw);
  hitEnemies(G.p.x+Math.sin(G.p.yaw)*0.9, G.p.z+Math.cos(G.p.yaw)*0.9, 1.15, dmg, 3.2, true);
  G.shake=heavy?0.42:0.26; G.p.hitStop=heavy?0.07:0.045;
  if(G.combo>=3){ G.combo=0; G.atkCd=c.atkCd; }
}
function trySkill(){
  if(G.mode!=="play"||G.p.dead||G.paused) return;
  const c=CLASSES[G.classId];
  if(G.skillCd>0||G.p.mp<c.skillMp) return;
  G.p.mp-=c.skillMp; G.skillCd=c.skillCd;
  if(G.classId==="swordsman"){ G.p.spinT=0.7; G.shake=0.35; }
  else if(G.classId==="mage"){
    G.p.atkT=0.3; G.shake=0.28; playAttack(G.player, 0.45);
    const cx=G.p.x+Math.sin(G.p.yaw)*2.2, cz=G.p.z+Math.cos(G.p.yaw)*2.2;
    burst(cx,0.6,cz,0xb48cff,18); hitEnemies(cx,cz,2.4,c.skill,3.0,false);
  } else {
    G.p.atkT=0.3; playAttack(G.player, 0.35);
    [-24,-12,0,12,24].forEach((a,i)=>setTimeout(()=>fireShot(false,a*Math.PI/180,c.skill,20), i*40));
  }
  refreshHUD();
}
function fireShot(magic, yawOff, dmg, spd){
  const yaw=G.p.yaw+yawOff;
  const s={ x:G.p.x+Math.sin(yaw)*0.6, z:G.p.z+Math.cos(yaw)*0.6, y:0.7, vx:Math.sin(yaw)*spd, vz:Math.cos(yaw)*spd, dmg, life:magic?1.0:0.8, magic };
  const mat=magic? new THREE.MeshToonMaterial({ color:0xb48cff, gradientMap, emissive:0x7744ff, emissiveIntensity:0.6 }) : toon(0xe8d9a0);
  const m=mesh(magic?geo.sphere:geo.cap, mat, s.x,s.y,s.z, magic?0.28:0.08, magic?0.28:0.28, magic?0.28:0.08, scene, 0.02, false);
  if(!magic) m.rotation.x=Math.PI/2;
  s.mesh=m; G.shots.push(s);
}
function hitEnemies(x,z,r,dmg,knock,isSword){
  G.enemies.forEach(e=>{
    if(e.dead) return;
    const dx=e.x-x, dz=e.z-z; if(dx*dx+dz*dz>r*r) return;
    e.hp-=dmg; e.kx+=(e.x-G.p.x)*knock*0.4; e.kz+=(e.z-G.p.z)*knock*0.4;
    dmgText(e.x, e.z, 1.2, dmg);
    burst(e.x, 0.7, e.z, isSword?0xffe08a:0xffffff, isSword?10:6);
    if(e.hp<=0) killEnemy(e);
  });
}
function killEnemy(e){
  e.dead=true; e.deadT=0; notifyKill();
  const q=tracked();
  if(q && qst(q.id).st==="active" && q.type==="collect") spawnShard(e.x, e.z);
  if(e.boss) toast("蚀雾史莱姆倒下了。回古井广场向苏晚晴复命。");
}

function tryTalk(){
  if(G.mode!=="play"||!G.near||G.paused) return;
  const npc=G.near;
  let q=null, acceptId=null, turnId=null, lines;
  for(const qq of QUESTS){
    const s=qst(qq.id).st;
    if(s==="ready"&&qq.turn===npc.id){ q=qq; lines=qq.turnIn; turnId=qq.id; break; }
    if(s==="active"&&qq.type==="talk"&&qq.target===npc.id){
      q=qq; const e=qst(qq.id); e.pr=qq.count; e.st="ready"; persist(G.save);
      if(qq.turn===npc.id){ lines=qq.turnIn; turnId=qq.id; } else lines=qq.turnIn.concat(qq.progress||[]);
      break;
    }
    if(s==="avail"&&qq.giver===npc.id){ q=qq; lines=(qq.greet||[]).concat(qq.accept||[]); acceptId=qq.id; break; }
    if(s==="active"&&qq.giver===npc.id){ q=qq; lines=qq.progress; break; }
  }
  if(!lines){
    const idle={ mayor:["青岚镇虽小，却不愿把灯先熄掉。"], herb:["这些药草还撑得住。雾若再浓，花瓣就会先皱起来。"], guard:["镇门以内，你是客人；镇门以外，你得自己小心。"] };
    lines=idle[npc.id]||["……"];
  }
  G.dlg={ lines, i:0, acceptId, turnId, name:npc.name };
  G.paused=true;
  $("dlg").style.display="block"; $("dlgName").textContent=npc.name; $("dlgBody").textContent=lines[0];
}
function advDlg(){
  if(!G.dlg) return;
  if(G.dlg.i<G.dlg.lines.length-1){ G.dlg.i++; $("dlgBody").textContent=G.dlg.lines[G.dlg.i]; return; }
  if(G.dlg.acceptId) acceptQuest(QUESTS.find(q=>q.id===G.dlg.acceptId));
  if(G.dlg.turnId) turnIn(QUESTS.find(q=>q.id===G.dlg.turnId));
  $("dlg").style.display="none"; G.dlg=null; G.paused=false;
}

function update(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i], u=p.userData; u.life-=dt;
    if(u.kind==="slash"){ p.rotation.z+=dt*8; p.material.opacity=Math.max(0,u.life*3); p.scale.addScalar(dt*1.2); }
    else if(u.vx!=null){ p.position.x+=u.vx*dt; p.position.y+=u.vy*dt; p.position.z+=u.vz*dt; u.vy-=9*dt; if(p.material) p.material.opacity=Math.max(0,u.life*2); }
    else { p.position.y+=(u.vy||1)*dt; if(p.material) p.material.opacity=Math.max(0,u.life*1.4); }
    if(u.life<=0){ scene.remove(p); G.parts.splice(i,1); }
  }
  // idle bob for posed / title cameras
  if(G.freezeCam || G.mode!=="play"){
    if(G.player) animBob(G.player, false, dt, G.p.atkT>0, G.p.spinT>0, G.p.dead);
    (G._cast||[]).forEach(ch=>animBob(ch,false,dt,false,false,false));
    (G._lineup||[]).forEach(ch=>animBob(ch,false,dt,false,false,false));
    G.npcs.forEach(n=>animBob(n.mesh,false,dt,false,false,false));
    G.enemies.forEach(e=>{ if(!e.dead) animBob(e.mesh, false, dt, false,false,false); });
  }

  if(G.mode!=="play") return;
  const c=CLASSES[G.classId];
  G.skillCd=Math.max(0,G.skillCd-dt);
  G.atkCd=Math.max(0,G.atkCd-dt);
  if(G.p.hitStop>0){ G.p.hitStop-=dt; return; }
  if(G.paused) return;

  if(!G.p.dead) G.p.mp=Math.min(c.mp, G.p.mp+4*dt);
  let ix=G.joy.x, iz=G.joy.y;
  if(G.keys["KeyW"]||G.keys["ArrowUp"]) iz+=1;
  if(G.keys["KeyS"]||G.keys["ArrowDown"]) iz-=1;
  if(G.keys["KeyA"]||G.keys["ArrowLeft"]) ix-=1;
  if(G.keys["KeyD"]||G.keys["ArrowRight"]) ix+=1;
  // camera-relative input: up = away from camera, right = screen right
  { const fx=G.p.x-camera.position.x, fz=G.p.z-camera.position.z, fl=Math.hypot(fx,fz)||1;
    const ffx=fx/fl, ffz=fz/fl, rx=-ffz, rz=ffx; // right vector (screen right) for a Y-up camera
    const wx=ix*rx+iz*ffx, wz=ix*rz+iz*ffz; ix=wx; iz=wz; }
  const len=Math.hypot(ix,iz);
  if(len>1){ ix/=len; iz/=len; }
  const busy=G.p.atkT>0||G.p.spinT>0||G.p.dead;
  if(!G.freezeCam && !busy && len>0.05){
    G.p.yaw=Math.atan2(ix, iz);
    const spd=c.spd;
    let nx=G.p.x+ix*spd*dt, nz=G.p.z+iz*spd*dt;
    if(inTownBounds(nx,G.p.z)) G.p.x=nx;
    if(inTownBounds(G.p.x,nz)) G.p.z=nz;
  }
  if(G.p.atkT>0) G.p.atkT-=dt;
  if(G.p.spinT>0){ G.p.spinT-=dt; hitEnemies(G.p.x, G.p.z, 1.7, c.skill*dt*2.2, 1.2, true); }
  if(G.player){
    G.player.position.x=G.p.x; G.player.position.z=G.p.z;
    if(G.p.spinT<=0) G.player.rotation.y=G.p.yaw;
    if(!G.freezeCam) animBob(G.player, !busy && len>0.05, dt, G.p.atkT>0, G.p.spinT>0, G.p.dead);
  }
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i]; s.life-=dt; s.x+=s.vx*dt; s.z+=s.vz*dt;
    s.mesh.position.set(s.x,s.y,s.z);
    let hit=false;
    G.enemies.forEach(e=>{
      if(e.dead||hit) return;
      if((e.x-s.x)**2+(e.z-s.z)**2 < 0.7*0.7){ hitEnemies(s.x,s.z, s.magic?1.6:0.7, s.dmg, 1.4, false); hit=true; }
    });
    if(hit||s.life<=0){ scene.remove(s.mesh); G.shots.splice(i,1); }
  }
  for(let i=G.pickups.length-1;i>=0;i--){
    const p=G.pickups[i]; p.mesh.rotation.y+=dt*3; p.mesh.position.y=0.45+Math.sin(performance.now()/300)*0.1;
    if((p.x-G.p.x)**2+(p.z-G.p.z)**2<1.2){ notifyCollect(); toast("获得 蚀核碎片"); scene.remove(p.mesh); G.pickups.splice(i,1); }
  }
  let alive=0;
  G.enemies.forEach(e=>{
    if(e.dead){
      e.deadT=(e.deadT||0)+dt; animBob(e.mesh,false,dt,false,false,true);
      if(e.deadT>1.1 && e.mesh.parent) scene.remove(e.mesh);
      return;
    }
    alive++;
    e.kx*=0.85; e.kz*=0.85;
    const dx=G.p.x-e.x, dz=G.p.z-e.z, dist=Math.hypot(dx,dz);
    if(!G.freezeCam && !G.p.dead && dist<9){
      if(dist>1.3){ e.x+=dx/dist*e.spd*dt; e.z+=dz/dist*e.spd*dt; e.mesh.rotation.y=Math.atan2(dx,dz); animBob(e.mesh,true,dt,false,false,false); }
      else {
        e.cd-=dt;
        if(e.cd<=0){ e.cd=1.35; if(dist<1.7) damagePlayer(e.dmg); }
        animBob(e.mesh,false,dt,true,false,false);
      }
    }
    e.x+=e.kx*dt; e.z+=e.kz*dt;
    if(e.z<17) e.z=17;
    e.mesh.position.x=e.x; e.mesh.position.z=e.z;
  });
  if(!G.freezeCam && alive<6 && Math.random()<dt*0.25){
    const a=Math.random()*Math.PI*2, r=3+Math.random()*9;
    spawnSlime(Math.sin(a)*r, 32+Math.cos(a)*r*0.6, false);
  }
  G.near=null; let best=9;
  G.npcs.forEach(n=>{ const d=Math.hypot(n.x-G.p.x,n.z-G.p.z); if(d<2.6&&d<best){best=d;G.near=n;} });
  if($("talk")) $("talk").style.display=(G.near && G.mode==="play")?"block":"none";

  if(!G.freezeCam){
    // fixed 45-degree diagonal top-down follow camera (pitch 45, yaw 45); pull back on portrait screens
    const asp=innerWidth/innerHeight, D=asp<1? 14+(1-asp)*6 : 11;
    const h=D*0.7071, hz=D*0.7071*0.7071;
    const cx=G.p.x+hz, cy=h, cz=G.p.z-hz;
    camera.position.lerp(tmpV.set(cx,cy,cz), 1-Math.exp(-8*dt));
    G.shake=Math.max(0,G.shake-dt*1.8);
    const sh=G.shake*G.shake;
    camera.position.x+=(Math.random()-0.5)*0.3*sh;
    camera.position.y+=(Math.random()-0.5)*0.25*sh;
    camera.lookAt(G.p.x, 1.1, G.p.z);
  }
  if((refreshHUD._acc=(refreshHUD._acc||0)+dt)>0.25){ refreshHUD._acc=0; refreshHUD(); }
}
function damagePlayer(amt){
  if(G.p.dead) return;
  G.p.hp=Math.max(0,G.p.hp-amt);
  burst(G.p.x,0.8,G.p.z,0xff8888,8); dmgText(G.p.x,G.p.z,1.4,amt); G.shake=0.2; refreshHUD();
  if(G.p.hp<=0){ G.p.dead=true; $("over").style.display="flex"; }
}
function resurrect(){
  const c=CLASSES[G.classId];
  G.p.hp=c.hp; G.p.mp=c.mp; G.p.dead=false; G.p.x=0; G.p.z=-3.2; G.p.yaw=0;
  if(G.player) G.player.scale.set(1,1,1);
  $("over").style.display="none"; refreshHUD();
}
function toTitle(){
  G.mode="select"; $("playHud").style.display="none"; $("select").style.display="flex"; $("over").style.display="none";
}

function bindInput(){
  const joy=$("joy"), knob=$("knob");
  function setFrom(cx,cy,rect){
    let x=(cx-rect.left-rect.width/2)/(rect.width*0.5);
    let y=(cy-rect.top-rect.height/2)/(rect.height*0.5);
    const l=Math.hypot(x,y); if(l>1){ x/=l;y/=l; }
    G.joy.x=x; G.joy.y=-y; G.joy.on=true;
    knob.style.transform="translate("+(x*50)+"px,"+(y*50)+"px)";
  }
  function endJoy(){ G.joy.x=G.joy.y=0; G.joy.on=false; knob.style.transform=""; }
  function pid(e){ return e.pointerId!=null?e.pointerId:1; }
  joy.addEventListener("pointerdown", e=>{ joy.setPointerCapture(pid(e)); setFrom(e.clientX,e.clientY,joy.getBoundingClientRect()); e.preventDefault(); });
  joy.addEventListener("pointermove", e=>{ if(G.joy.on) setFrom(e.clientX,e.clientY,joy.getBoundingClientRect()); });
  joy.addEventListener("pointerup", endJoy);
  joy.addEventListener("pointercancel", endJoy);
  $("atk").addEventListener("pointerdown", e=>{ e.preventDefault(); tryAttack(); G.atkHeld=true; });
  $("atk").addEventListener("pointerup", ()=>G.atkHeld=false);
  $("sk").addEventListener("pointerdown", e=>{ e.preventDefault(); trySkill(); });
  $("talk").addEventListener("click", tryTalk);
  $("dlgNext").addEventListener("click", advDlg);
  $("goTown").addEventListener("click", resurrect);
  $("goTitle").addEventListener("click", toTitle);
  $("fs").addEventListener("click", ()=>{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(document.fullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(req) req.call(el);
  });
  window.addEventListener("keydown", e=>{
    G.keys[e.code]=true;
    if(e.code==="Space"||e.code==="KeyJ") tryAttack();
    if(e.code==="KeyK"||e.code==="KeyQ") trySkill();
    if(e.code==="KeyE"||e.code==="KeyF") tryTalk();
  });
  window.addEventListener("keyup", e=>G.keys[e.code]=false);
  document.addEventListener("touchmove", e=>{ if(e.target.closest&&e.target.closest("#select")) return; e.preventDefault(); }, {passive:false});
  document.addEventListener("gesturestart", e=>e.preventDefault());
  document.addEventListener("dblclick", e=>e.preventDefault());
}
function buildClassCards(){
  const wrap=$("cards"); wrap.innerHTML="";
  CLASS_ORDER.forEach(id=>{
    const d=CLASSES[id];
    const el=document.createElement("div");
    el.className="card"+(id==="swordsman"?" sel sw":"");
    el.dataset.id=id;
    el.innerHTML="<h3>"+d.name+"</h3><div class='en'>"+d.en+"</div><div class='st'>"+d.sub+"</div><p>"+d.desc+"</p><div>生命 "+d.hp+"　法力 "+d.mp+"</div>"+(d.rec?"<div class='rec'>推荐</div>":"");
    el.addEventListener("click", ()=>{
      G.classId=id;
      [...wrap.children].forEach(c=>c.className="card"+(c.dataset.id===id? (id==="swordsman"?" sel sw":" sel"):""));
    });
    wrap.appendChild(el);
  });
  $("btnGo").addEventListener("click", ()=>startAdventure(G.classId,true));
  const sv=loadSave();
  if(sv&&sv.hasSave){ $("btnCont").style.display="inline-block"; $("btnCont").addEventListener("click", ()=>{ G.save=sv; startAdventure(sv.classId||"swordsman", false); }); }
}

function init(){
  if(!window.THREE){ document.body.insertAdjacentHTML("beforeend","<p style='padding:20px'>无法加载 Three.js。</p>"); return; }
  const canvas=$("c");
  renderer=new THREE.WebGLRenderer({ canvas, antialias:!isMobile, alpha:false, powerPreference:"high-performance" });
  const dpr=Math.min(window.devicePixelRatio||1, isMobile?1.25:1.75);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xc5e4ff, 24, 62);
  camera=new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.2, 100);
  camera.position.set(10.5, 9.5, -13);
  clock=new THREE.Clock();
  gradientMap=makeGradientMap();

  const hemi=new THREE.HemisphereLight(0xc8e8ff, 0x6a9a58, 0.72); scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff1c8, 1.35); sun.position.set(14,18,7); scene.add(sun);
  sun.castShadow=true;
  const ss=isMobile?512:1024;
  sun.shadow.mapSize.set(ss,ss);
  sun.shadow.camera.near=1; sun.shadow.camera.far=70;
  sun.shadow.camera.left=-30; sun.shadow.camera.right=30;
  sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
  sun.shadow.bias=-0.0008;
  const rim=new THREE.DirectionalLight(0xd8f0ff, 0.45); rim.position.set(-10,8,-12); scene.add(rim);

  buildWorld();
  spawnNpcVisuals();
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2, r=3+Math.random()*8;
    spawnSlime(Math.sin(a)*r, 32+Math.cos(a)*r*0.5, false);
  }
  camera.lookAt(0,0.6,3);
  bindInput();
  buildClassCards();
  window.__mengyu={ G, GLB };
  loadCharacterModels(()=>{ upgradeVisuals(); try{ cardThumbs(); }catch(e){ console.warn('thumbs', e); } });
  window.addEventListener("resize", ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
  });

  if(shot==="select"){ applyShotCamera(); }
  else if(shot==="play"){ startAdventure("swordsman", true); }
  else if(shot==="playfield"){ startAdventure("swordsman", true); G.p.x=0; G.p.z=26; }
  else if(shot==="town"||shot==="field"||shot==="combat"){ startAdventure("swordsman", true); applyShotCamera(); }

  function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05, clock.getDelta());
    update(dt);
    if(G.atkHeld && G.classId==="swordsman") tryAttack();
    renderer.render(scene, camera);
    if(!loop._ready){ loop._ready=1; document.documentElement.setAttribute("data-ready","1"); document.title="ready"; }
  }
  loop();
}
init();
})();

</script>
