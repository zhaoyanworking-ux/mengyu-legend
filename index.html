function canvasTex(draw, size, repeatX, repeatY, nearest){
  const S=size||256;
  const c=document.createElement("canvas"); c.width=c.height=S;
  draw(c.getContext("2d"), S);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=isMobile?4:8;
  t.repeat.set(repeatX||1, repeatY||1);
  if(nearest){ t.minFilter=t.magFilter=THREE.LinearFilter; }
  t.needsUpdate=true;
  return t;

        g.beginPath(); g.moveTo(x+ox+1,y); g.lineTo(x+ox+w-1,y); g.lineTo(x+ox+w-1,y+rowH*0.6);
        g.quadraticCurveTo(x+ox+w/2, y+rowH*1.25, x+ox+1, y+rowH*0.6); g.closePath(); g.fill();
        g.strokeStyle=c(0.62,0.55); g.lineWidth=1.5; g.stroke();
        g.fillStyle="rgba(255,255,255,0.16)"; g.fillRect(x+ox+3,y+2,w-6,3);
      }
    }
  }, 256, 3, 2);
}
function stoneTex(){
  return canvasTex((g,S)=>{
    g.fillStyle="#d6cbb6"; g.fillRect(0,0,S,S);
    for(let y=0;y<S;y+=22){
      for(let x=0;x<S;x+=28){
        const ox=(y/22|0)%2?14:0;
        g.fillStyle=["#ebe3d3","#e0d5c1","#f0e9dc","#d9cdb8"][(x+y)%4];
        g.beginPath(); g.roundRect(x+ox+1,y+1,25,19,4); g.fill();
        g.strokeStyle="rgba(120,100,70,0.28)"; g.stroke();
      }
    }
  }, 256, 2, 2);
}
function shadeHex(hex, k){
  const c=new THREE.Color(hex).getRGB({r:0,g:0,b:0}, THREE.SRGBColorSpace); // sRGB bytes for canvas
  return "rgb("+(Math.min(255,c.r*255*k)|0)+","+(Math.min(255,c.g*255*k)|0)+","+(Math.min(255,c.b*255*k)|0)+")";
}
function faceTex(opt){
  const skin=opt.skin||"#FFD6B8";
  const iris=opt.iris||"#3A7CFF";
  return canvasTex((g,S)=>{
    // skin
    g.fillStyle=skin; g.fillRect(0,0,S,S);
    // soft forehead shade
    const grd=g.createRadialGradient(S*0.5,S*0.42,20,S*0.5,S*0.5,S*0.55);
    grd.addColorStop(0,"rgba(255,255,255,0.0)");
    grd.addColorStop(1,"rgba(180,120,100,0.12)");
    g.fillStyle=grd; g.fillRect(0,0,S,S);

    function eye(cx,cy){
      g.fillStyle="#fff";
      g.beginPath(); g.ellipse(cx,cy,56,68,0,0,Math.PI*2); g.fill();
      g.strokeStyle="rgba(40,20,30,0.4)"; g.lineWidth=3; g.stroke();
      const ig=g.createRadialGradient(cx-6,cy+4,3,cx,cy+6,34);
      ig.addColorStop(0,"#ffffff");
      ig.addColorStop(0.18,iris);
      ig.addColorStop(1, shadeHex(iris,0.52));
      g.fillStyle=ig;
      g.beginPath(); g.ellipse(cx,cy+8,34,40,0,0,Math.PI*2); g.fill();
      g.fillStyle="#1a1220";
      g.beginPath(); g.ellipse(cx,cy+10,14,18,0,0,Math.PI*2); g.fill();
      g.fillStyle="#fff";
      g.beginPath(); g.arc(cx-12,cy-6,12,0,Math.PI*2); g.fill();
      g.beginPath(); g.arc(cx+11,cy+12,6,0,Math.PI*2); g.fill();
      g.strokeStyle="#2a1c22"; g.lineWidth=6; g.lineCap="round";
      g.beginPath(); g.ellipse(cx,cy,56,68,0,Math.PI*1.08,Math.PI*1.92); g.stroke();
      g.strokeStyle="#3a2a28"; g.lineWidth=5;
      g.beginPath(); g.arc(cx,cy-14,58,Math.PI*1.15,Math.PI*1.85); g.stroke();
    }
    const cy=S*0.45, dx=S*0.125;
    eye(S*0.5-dx, cy);
    eye(S*0.5+dx, cy);
    g.fillStyle="rgba(255,130,140,0.42)";
    g.beginPath(); g.ellipse(S*0.5-108, S*0.60, 32, 16, 0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(S*0.5+108, S*0.60, 32, 16, 0,0,Math.PI*2); g.fill();
    g.strokeStyle="#c07070"; g.lineWidth=5; g.lineCap="round";
    g.beginPath(); g.arc(S*0.5, S*0.63, 24, 0.15*Math.PI, 0.85*Math.PI); g.stroke();
  }, 512, 1, 1);
}

function shieldTex(){
  return canvasTex((g,S)=>{
    g.clearRect(0,0,S,S);
    const cx=S/2,cy=S/2,r=S*0.46;
    const bg=g.createRadialGradient(cx,cy,10,cx,cy,r);
    bg.addColorStop(0,"#7eb6ff"); bg.addColorStop(1,"#2f6adf");
    g.fillStyle=bg; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fill();
    g.strokeStyle="#f0d060"; g.lineWidth=14; g.stroke();
    g.strokeStyle="#fff3a8"; g.lineWidth=4; g.stroke();
    // gold crest (stylized bird)
    g.fillStyle="#f0d060";
    g.beginPath();
    g.moveTo(cx, cy-70);
    g.lineTo(cx+28, cy-10);
    g.lineTo(cx+55, cy+10);
    g.lineTo(cx+18, cy+8);
    g.lineTo(cx+8, cy+70);
    g.lineTo(cx, cy+28);
    g.lineTo(cx-8, cy+70);
    g.lineTo(cx-18, cy+8);
    g.lineTo(cx-55, cy+10);
    g.lineTo(cx-28, cy-10);
    g.closePath(); g.fill();
    g.strokeStyle="#c9a020"; g.lineWidth=3; g.stroke();
  }, 256, 1, 1);
}
function slimeFaceTex(iris, angry){
  return canvasTex((g,S)=>{
    g.fillStyle="rgba(0,0,0,0)"; g.clearRect(0,0,S,S);
    // transparent except features — actually slime body is colored; we put face on a decal or full tint
    g.fillStyle="rgba(255,255,255,0)"; g.fillRect(0,0,S,S);
    function eye(cx,cy){
      g.fillStyle="#fff";
      g.beginPath(); g.ellipse(cx,cy,48,56,0,0,Math.PI*2); g.fill();
      g.fillStyle=iris;
      g.beginPath(); g.ellipse(cx,cy+8,28,32,0,0,Math.PI*2); g.fill();
      g.fillStyle="#1a1220";
      g.beginPath(); g.ellipse(cx,cy+10,13,16,0,0,Math.PI*2); g.fill();
      g.fillStyle="#fff";
      g.beginPath(); g.arc(cx-10,cy-4,10,0,Math.PI*2); g.fill();
      if(angry){
        g.strokeStyle="#2a1020"; g.lineWidth=8;
        g.beginPath(); g.moveTo(cx-40,cy-40); g.lineTo(cx+10,cy-20); g.stroke();
      }
    }
    const cy=S*0.46, dx=S*0.12;
    eye(S*0.5-dx,cy); eye(S*0.5+dx,cy);
    g.fillStyle="rgba(255,140,160,0.3)";
    g.beginPath(); g.ellipse(S*0.5-90,S*0.6,24,12,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(S*0.5+90,S*0.6,24,12,0,0,Math.PI*2); g.fill();
    g.strokeStyle="#c07080"; g.lineWidth=5; g.lineCap="round";
    g.beginPath(); g.arc(S*0.5,S*0.62,20,0.2*Math.PI,0.8*Math.PI); g.stroke();
  }, 512, 1, 1);
}

/* ---------- characters ---------- */
function skinMat(texMap){ return toon(0xffffff, texMap); }

function makeHead(parent, opt){
  const face=tex("face_"+opt.key, ()=>faceTex(opt));
  const head=mesh(geo.sphereF, skinMat(face), 0, 1.12, 0.02, 0.92, 0.88, 0.90, parent, 0.028, true);
  return head;
}
function addHairBurst(head, color, spikes){
  // cap
  mesh(geo.sphere, toon(color), 0, 0.18, -0.08, 0.98, 0.72, 0.95, head, 0.025, true);
  // bangs
  mesh(geo.sphere, toon(color), -0.28, 0.10, 0.28, 0.36, 0.32, 0.30, head, 0.02, true);
  mesh(geo.sphere, toon(color), 0.28, 0.10, 0.28, 0.36, 0.32, 0.30, head, 0.02, true);
  mesh(geo.sphere, toon(color), 0.00, 0.16, 0.36, 0.28, 0.22, 0.22, head, 0.02, true);
  (spikes||[]).forEach(s=>{
    const sp=mesh(geo.sphere, toon(color), s[0], s[1], s[2], s[3], s[4], s[5], head, 0.02, true);
    if(s[6]) sp.rotation.set(s[6],s[7]||0,s[8]||0);
  });
}
function limb(parent, color, x,y,z, sx,sy,sz){
  // group pivot at the shoulder / hip so children (hands, weapons) are not crushed by mesh scale
  const g=new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  const L=1.85*(sy==null?sx:sy);
  mesh(geo.cap, toon(color), 0, -L/2, 0, sx,sy,sz, g, 0.028, true);
  g.userData.tip=-L;
  return g;
}
function handAt(arm, skin, r){
  return mesh(geo.sphere, toon(skin), 0, arm.userData.tip, 0, r,r,r, arm, 0.02, true);
}

function makeSlime(bodyColor, iris, scale, angry){
  const g=new THREE.Group();
  const col=new THREE.Color(bodyColor);
  // face texture filled with body color so the sphere stays solid
  const ft=canvasTex((ctx,S)=>{
    ctx.fillStyle="#"+col.getHexString(); // sRGB
    ctx.fillRect(0,0,S,S);
    function eye(cx,cy){
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.ellipse(cx,cy,46,54,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=iris||"#2a1c28";
      ctx.beginPath(); ctx.ellipse(cx,cy+8,26,30,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#1a1220";
      ctx.beginPath(); ctx.ellipse(cx,cy+10,12,15,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(cx-10,cy-4,10,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+8,cy+8,4,0,Math.PI*2); ctx.fill();
      if(angry){
        ctx.strokeStyle="#2a1020"; ctx.lineWidth=8; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(cx-44,cy-36); ctx.lineTo(cx+8,cy-16); ctx.stroke();
      }
    }
    const cy=S*0.47, dx=S*0.12;
    eye(S*0.5-dx,cy); eye(S*0.5+dx,cy);
    ctx.fillStyle="rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.ellipse(S*0.35,S*0.28,40,22, -0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,140,160,0.28)";
    ctx.beginPath(); ctx.ellipse(S*0.5-88,S*0.6,22,12,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(S*0.5+88,S*0.6,22,12,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba(80,30,50,0.45)"; ctx.lineWidth=5; ctx.lineCap="round";
    if(angry){ ctx.beginPath(); ctx.arc(S*0.5,S*0.70,16,1.1*Math.PI,1.9*Math.PI); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(S*0.5,S*0.61,20,0.2*Math.PI,0.8*Math.PI); ctx.stroke(); }
  }, 512, 1, 1);
  const body=mesh(geo.sphereF, toon(0xffffff, ft), 0, 0.42, 0, 1.15, 0.88, 1.08, g, 0.04, true);
  // shine highlight blob
  mesh(geo.sphere, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45 }), -0.22, 0.18, 0.28, 0.28, 0.18, 0.16, body, 0, false);
  g.userData={ body, head:body, phase:Math.random()*10, kind:"slime", baseY:0.42, uniScale:(scale||1) };
  blobShadow(g, 0.48);
  g.scale.setScalar(scale||1);
  return g;
}

function animBob(ch, moving, dt, attacking, spinning, dead){
  if(ch.userData && ch.userData.gltf){ animGlb(ch, moving, dt, attacking, spinning, dead); return; }
  const u=ch.userData; if(!u||!u.body) return;
  u.phase=(u.phase||0)+dt*(moving?11:2.4);
  const s=Math.sin(u.phase);
  // squash & stretch
  if(!dead && u.kind==="slime"||u.kind==="boss"){
    const sq=1+s*0.10;
    const base=ch.scale.x||1; // keep uniform boss scale-ish
  }
  if(!dead){
    const bob=moving?Math.abs(s)*0.05:s*0.025;
    if(u.body && u.kind!=="slime" && u.kind!=="boss"){
      // slight body bob already in group
    }
    ch.position.y = (ch.userData.groundY||0) + (moving?Math.abs(s)*0.06:s*0.03);
    const squash=1 + (moving?Math.abs(s):s)*((u.kind==='slime'||u.kind==='boss')?0.02:0.04);
    const uni=ch.userData.uniScale||1;
    ch.scale.set(uni*(2-squash), uni*squash, uni*(2-squash));
    const sw=moving?Math.sin(u.phase)*0.5:Math.sin(u.phase*0.5)*0.08;
    if(u.armL){ u.armL.rotation.x= attacking? -1.05 : (moving?sw:-0.35); u.armL.rotation.z=0.35; }
    if(u.armR){ u.armR.rotation.x= attacking? -1.45 : (moving?-sw:-0.55); u.armR.rotation.z=-0.22; }
    if(u.legL) u.legL.rotation.x=-sw*0.85;
    if(u.legR) u.legR.rotation.x= sw*0.85;
  }
  if(spinning) ch.rotation.y += dt*12;
  if(dead){
    ch.scale.y=Math.max(0.12, ch.scale.y-dt*1.6);
    ch.scale.x=Math.min(1.8*(ch.userData.uniScale||1), ch.scale.x+dt);
    ch.scale.z=ch.scale.x;
  }
}

/* ---------- authored town model ---------- */

function townMaterial(old){
  const m=new THREE.MeshToonMaterial({ color:0xffffff, map:old.map||null, gradientMap, side:THREE.DoubleSide,
    emissive:old.map?0xffffff:0x000000, emissiveMap:old.map||null, emissiveIntensity:0.06 });
  if(m.map){ m.map.colorSpace=THREE.SRGBColorSpace; m.map.anisotropy=renderer.capabilities.getMaxAnisotropy?Math.min(8,renderer.capabilities.getMaxAnisotropy()):4; }
  return m;
}
function buildTownGrid(meshes){
  const box=new THREE.Box3().setFromObject(TOWN.root);
  const pad=2.2, cell=0.32;
  const ox=box.min.x-pad, oz=box.min.z-pad;
  const nx=Math.ceil((box.max.x-box.min.x+pad*2)/cell);
  const nz=Math.ceil((box.max.z-box.min.z+pad*2)/cell);
  const height=new Float32Array(nx*nz);
  const walk=new Uint8Array(nx*nz);
  const ray=new THREE.Raycaster();
  const origin=new THREE.Vector3(), dir=new THREE.Vector3(0,-1,0);
  const maxWalkH=0.48;
  for(let iz=0;iz<nz;iz++){
    for(let ix=0;ix<nx;ix++){
      const x=ox+(ix+0.5)*cell, z=oz+(iz+0.5)*cell;
      origin.set(x, 40, z);
      ray.set(origin, dir);
      const rec=ray.intersectObjects(meshes, true);
      if(!rec.length){ height[iz*nx+ix]=0; walk[iz*nx+ix]=1; }
      else { const y=Math.max(0, rec[0].point.y); height[iz*nx+ix]=y; walk[iz*nx+ix]=y<=maxWalkH?1:0; }
    }
  }
  const walk2=new Uint8Array(walk);
  for(let iz=0;iz<nz;iz++){
    for(let ix=0;ix<nx;ix++){
      if(walk[iz*nx+ix]) continue;
      for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){
        const jx=ix+dx, jz=iz+dz;
        if(jx>=0&&jz>=0&&jx<nx&&jz<nz) walk2[jz*nx+jx]=0;
      }
    }
  }
  const maxR=Math.max(box.max.x-TOWN.fx, TOWN.fx-box.min.x, box.max.z-TOWN.fz, TOWN.fz-box.min.z)+1.4;
  for(let iz=0;iz<nz;iz++){
    for(let ix=0;ix<nx;ix++){
      const x=ox+(ix+0.5)*cell, z=oz+(iz+0.5)*cell;
      const inCorridor=z>TOWN.fz+6 && Math.abs(x-TOWN.fx)<4.6;
      const r=Math.hypot(x-TOWN.fx, z-TOWN.fz);
      if(r>maxR && !inCorridor) walk2[iz*nx+ix]=0;
    }
  }
  // keep a clear cobble path from the plaza through the open north side to the field gate
  const pathHalf=1.7;
  for(let iz=0;iz<nz;iz++){
    const z=oz+(iz+0.5)*cell;
    if(z<TOWN.fz+5.5 || z>TOWN_CFG.fieldZ+0.6) continue;
    for(let ix=0;ix<nx;ix++){
      const x=ox+(ix+0.5)*cell;
      if(Math.abs(x-TOWN.fx)>pathHalf) continue;
      const i=iz*nx+ix;
      if(height[i]<2.5){ walk2[i]=1; if(height[i]>0.45) height[i]=0; }
    }
  }
  TOWN.grid={ ox, oz, cell, nx, nz, height, walk:walk2 };
}
function placeTown(gltf){
  const root=gltf.scene;
  root.scale.setScalar(TOWN_CFG.scale);
  root.rotation.y=TOWN_CFG.rotY;
  root.position.set(0,0,0);
  root.updateMatrixWorld(true);
  const box0=new THREE.Box3().setFromObject(root);
  root.position.set(TOWN_CFG.fountainX, -box0.min.y, TOWN_CFG.fountainZ);
  root.updateMatrixWorld(true);
  const meshes=[];
  root.traverse(o=>{
    if(!o.isMesh) return;
    const old=o.material;
    o.material=townMaterial(old);
    if(old && old!==o.material && old.dispose) old.dispose();
    o.castShadow=true; o.receiveShadow=true;
    meshes.push(o);
  });
  if(TOWN.root && TOWN.root.parent) scene.remove(TOWN.root);
  scene.add(root);
  TOWN.root=root; TOWN.meshes=meshes;
  TOWN.fx=TOWN_CFG.fountainX; TOWN.fz=TOWN_CFG.fountainZ;
  buildTownGrid(meshes);
  TOWN.ready=true;
}
function loadTownModel(onDone){
  window.__townReady=false;
  function fail(err){ console.warn("town GLB failed", err); window.__townReady=true; if(onDone) onDone(false); }
  function ok(gltf){ try{ placeTown(gltf); }catch(e){ console.warn("town prep failed", e); } window.__townReady=true; if(onDone) onDone(!!TOWN.ready); }
  if(!window.THREE_ADDONS){ fail("no addons"); return; }
  const loader=new THREE_ADDONS.GLTFLoader();
  if(THREE_ADDONS.MeshoptDecoder) loader.setMeshoptDecoder(THREE_ADDONS.MeshoptDecoder);
  const fromFile=location.protocol==="file:";
  if(fromFile){
    const sc=document.createElement("script"); sc.src=TOWN_CFG.url+".js";
    sc.onload=()=>{
      try{
        const bin=atob((window.__GLB_B64||{}).town||""); const buf=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
        loader.parse(buf.buffer, "", ok, err=>fail(err));
      }catch(e){ fail(e); }
    };
    sc.onerror=()=>fail("town script missing");
    document.head.appendChild(sc);
    return;
  }
  loader.load(TOWN_CFG.url, ok, undefined, err=>fail(err&&err.message));
}

const PS_VS=[
"attribute vec3 iPos; attribute vec3 iDir; attribute vec4 iCol; attribute float iSz;",
"varying vec2 vUv; varying vec4 vCol;",
"void main(){",
"  vec4 mv=modelViewMatrix*vec4(iPos,1.0);",
"  vec2 d=(modelViewMatrix*vec4(iDir,0.0)).xy;",
"  float L=length(d);",
"  vec2 ax=L>0.0001?d/L:vec2(1.0,0.0);",
"  vec2 ay=vec2(-ax.y,ax.x);",
"  mv.xy+=ax*position.x*(iSz+L*0.5)+ay*position.y*iSz;",
"  gl_Position=projectionMatrix*mv;",
"  vUv=position.xy; vCol=iCol;",
"}"].join("\n");
const PS_FS_ADD=[
"varying vec2 vUv; varying vec4 vCol;",
"void main(){ float r=length(vUv); if(r>1.0) discard; float a=1.0-r; a*=a;",
"  vec3 c=mix(vCol.rgb, vec3(1.0), smoothstep(0.45,0.0,r)*0.45);",
"  gl_FragColor=vec4(c, min(1.0,a*vCol.a*1.4)); }"].join("\n");
const PS_FS_ALPHA=[
"varying vec2 vUv; varying vec4 vCol;",
"void main(){ float r=length(vUv); if(r>1.0) discard; float a=smoothstep(1.0,0.3,r);",
"  gl_FragColor=vec4(vCol.rgb, a*vCol.a); }"].join("\n");
const SL_VS="varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }";
const SL_FS=[
"uniform vec3 uCol; uniform float uA; uniform float uHead; uniform float uTail; varying vec2 vUv;",
"void main(){ float d=uHead-vUv.x; if(d<0.0||d>uTail) discard; float k=1.0-d/uTail; float e=vUv.y;",
"  float edge=smoothstep(1.0,0.9,e);",
"  float a=k*(0.08+0.8*e*e)*edge*uA;",
"  vec3 c=mix(uCol, vec3(1.0), clamp(e*e*e*k*0.8,0.0,1.0));",
"  gl_FragColor=vec4(c,a); }"].join("\n");
const DC_FS=[
"uniform vec3 uCol; uniform float uA; uniform float uMode; uniform float uFill; uniform float uThick; uniform float uTime; varying vec2 vUv;",
"void main(){ vec2 p=vUv*2.0-1.0; float r=length(p); if(r>1.0) discard; float a=0.0; vec3 c=uCol;",
"  if(uMode<0.5){",
"    float b=smoothstep(1.0-uThick,1.0-uThick*0.35,r)*smoothstep(1.0,0.95,r); a=b*0.8+0.06*r*r*r; c=mix(uCol,vec3(1.0),b*0.25);",
"  } else if(uMode<1.5){",
"    float border=smoothstep(0.84,0.92,r)*smoothstep(1.0,0.96,r);",
"    float fill=step(r,uFill)*(0.30+0.40*smoothstep(uFill-0.14,uFill,r));",
"    a=border*0.95+fill+0.12; c=mix(uCol,vec3(1.0,0.95,0.8),border*0.25);",
"  } else {",
"    float ring1=smoothstep(0.90,0.94,r)*smoothstep(1.0,0.96,r);",
"    float ring2=smoothstep(0.66,0.69,r)*smoothstep(0.74,0.71,r);",
"    float ang=atan(p.y,p.x);",
"    float tick=step(0.55,fract(ang*1.9099+uTime*0.5))*step(0.76,r)*step(r,0.87);",
"    float st=0.0; float rot=uTime*0.8;",
"    for(int k=0;k<6;k++){ float an=rot+float(k)*1.0472; vec2 n=vec2(cos(an),sin(an)); st=max(st, smoothstep(0.035,0.0,abs(dot(p,n)-0.34))*step(r,0.69)); }",
"    a=ring1+ring2*0.9+tick*0.65+st*0.8+0.22*(1.0-r)*uFill; c=mix(uCol,vec3(1.0),ring1*0.45+st*0.25);",
"  }",
"  gl_FragColor=vec4(c,clamp(a,0.0,1.0)*uA); }"].join("\n");

function ParticleSys(max, additive){
  this.max=max; this.n=0;
  const g=new THREE.InstancedBufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0]),3));
  g.setIndex([0,1,2,0,2,3]);
  const A=(arr,k)=>{ const a=new THREE.InstancedBufferAttribute(arr,k); a.setUsage(THREE.DynamicDrawUsage); return a; };
  this.aPos=new Float32Array(max*3); this.aDir=new Float32Array(max*3); this.aCol=new Float32Array(max*4); this.aSz=new Float32Array(max);
  this.bufs=[A(this.aPos,3),A(this.aDir,3),A(this.aCol,4),A(this.aSz,1)];
  g.setAttribute("iPos",this.bufs[0]); g.setAttribute("iDir",this.bufs[1]); g.setAttribute("iCol",this.bufs[2]); g.setAttribute("iSz",this.bufs[3]);
  g.instanceCount=0; this.g=g;
  this.P=new Float32Array(max*3); this.V=new Float32Array(max*3); this.L=new Float32Array(max); this.M=new Float32Array(max);
  this.S=new Float32Array(max*2); this.C=new Float32Array(max*4); this.K=new Float32Array(max*3);
  const mat=new THREE.ShaderMaterial({ vertexShader:PS_VS, fragmentShader:additive?PS_FS_ADD:PS_FS_ALPHA,
    transparent:true, depthWrite:false, blending:additive?THREE.AdditiveBlending:THREE.NormalBlending });
  this.mesh=new THREE.Mesh(g, mat); this.mesh.frustumCulled=false; this.mesh.renderOrder=additive?12:11; this.mesh.visible=false;
}
// x,y,z  vx,vy,vz  life  size0,size1  hexColor  alpha  drag  gravity  stretch(sec)
ParticleSys.prototype.emit=function(x,y,z, vx,vy,vz, life, s0,s1, col, a, drag, grav, stretch){
  let i=this.n; if(i>=this.max) i=(Math.random()*this.max)|0; else this.n++;
  const i3=i*3, i4=i*4;
  this.P[i3]=x; this.P[i3+1]=y; this.P[i3+2]=z; this.V[i3]=vx; this.V[i3+1]=vy; this.V[i3+2]=vz;
  this.L[i]=life; this.M[i]=life; this.S[i*2]=s0; this.S[i*2+1]=s1;
  this.C[i4]=((col>>16)&255)/255; this.C[i4+1]=((col>>8)&255)/255; this.C[i4+2]=(col&255)/255; this.C[i4+3]=a;
  this.K[i3]=drag; this.K[i3+1]=grav; this.K[i3+2]=stretch;
};
ParticleSys.prototype._copy=function(s,d){
  const s3=s*3,d3=d*3,s4=s*4,d4=d*4;
  for(let k=0;k<3;k++){ this.P[d3+k]=this.P[s3+k]; this.V[d3+k]=this.V[s3+k]; this.K[d3+k]=this.K[s3+k]; }
  for(let k=0;k<4;k++) this.C[d4+k]=this.C[s4+k];
  this.L[d]=this.L[s]; this.M[d]=this.M[s]; this.S[d*2]=this.S[s*2]; this.S[d*2+1]=this.S[s*2+1];
};
ParticleSys.prototype.update=function(dt){
  let n=this.n;
  const P=this.P,V=this.V,L=this.L,M=this.M,S=this.S,C=this.C,K=this.K,aP=this.aPos,aD=this.aDir,aC=this.aCol,aS=this.aSz;
  for(let i=0;i<n;){
    L[i]-=dt;
    if(L[i]<=0){ n--; if(i!==n) this._copy(n,i); continue; }
    const i3=i*3, i4=i*4, dr=Math.max(0,1-K[i3]*dt);
    V[i3]*=dr; V[i3+1]=V[i3+1]*dr-K[i3+1]*dt; V[i3+2]*=dr;
    P[i3]+=V[i3]*dt; P[i3+1]+=V[i3+1]*dt; P[i3+2]+=V[i3+2]*dt;
    const f=1-L[i]/M[i], st=K[i3+2];
    aP[i3]=P[i3]; aP[i3+1]=P[i3+1]; aP[i3+2]=P[i3+2];
    aD[i3]=V[i3]*st; aD[i3+1]=V[i3+1]*st; aD[i3+2]=V[i3+2]*st;
    aC[i4]=C[i4]; aC[i4+1]=C[i4+1]; aC[i4+2]=C[i4+2]; aC[i4+3]=C[i4+3]*(1-f)*(f<0.08?f/0.08*0.6+0.4:1);
    aS[i]=S[i*2]+(S[i*2+1]-S[i*2])*f;
    i++;
  }
  this.n=n; this.g.instanceCount=n; this.mesh.visible=n>0;
  if(n>0){ const ks=[3,3,4,1]; for(let b=0;b<4;b++){ const bf=this.bufs[b]; if(bf.clearUpdateRanges){ bf.clearUpdateRanges(); bf.addUpdateRange(0,n*ks[b]); } bf.needsUpdate=true; } }
};

function arcGeo(angle, r0, r1, seg){
  const pos=new Float32Array((seg+1)*6), uv=new Float32Array((seg+1)*4), idx=[];
  for(let i=0;i<=seg;i++){
    const t=i/seg, a=-angle/2+angle*t;
    const w=Math.min(1,t*1.6)*Math.min(1,(1-t)*7+0.2);
    const rin=r1-(r1-r0)*w, s=Math.sin(a), c=Math.cos(a);
    pos.set([s*rin,0,c*rin, s*r1,0,c*r1], i*6); uv.set([t,0, t,1], i*4);
    if(i<seg){ const k=i*2; idx.push(k,k+1,k+3, k,k+3,k+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3)); g.setAttribute("uv", new THREE.BufferAttribute(uv,2)); g.setIndex(idx);
  return g;
}

// kind: 0 normal, 1 crit, 2 player hurt, 3 status text
function spawnNum(x,y,z,val,kind){

function fxBurst(x,y,z,col,n,spd,life,size,grav){

function FX_update(dt){
  FX.time+=dt;
  FX.add.update(dt); FX.puff.update(dt);
  for(let i=0;i<FX.slashes.length;i++){
    const s=FX.slashes[i]; if(!s.on) continue;
    s.t+=dt; let f=s.t/s.life; const u=s.mat.uniforms;
    if(s.mode===1){
      if(G.p.spinT<=0 && s.life>s.t+0.12) s.life=s.t+0.12;
      f=s.t/s.life;
      s.mesh.position.set(G.p.x,(G.p.y||0)+0.6,G.p.z); s.mesh.rotation.y+=14*dt;
      u.uHead.value=1; u.uA.value=0.75*(G.p.spinT>0?Math.min(1,s.t*10):Math.max(0,(s.life-s.t)/0.12));
    } else {
      const sw=Math.min(1,f/0.42), e=1-(1-sw)*(1-sw)*(1-sw);
      u.uHead.value=e*(1+u.uTail.value); u.uA.value=f<0.5?1:Math.max(0,1-(f-0.5)/0.5);
      const sc=s.base*(1+0.14*f); s.mesh.scale.set(sc*s.mirror,sc,sc);
    }
    if(f>=1){ s.on=false; s.mesh.visible=false; }
  }
  for(let i=0;i<FX.decals.length;i++){
    const d=FX.decals[i]; if(!d.on) continue;
    d.t+=dt; const u=d.mat.uniforms; let f=Math.min(1,d.t/d.life), r=d.r1, a=1;
    if(d.kind==="shock"){ const e=1-(1-f)*(1-f)*(1-f); r=d.r0+(d.r1-d.r0)*e; a=1-f; u.uThick.value=0.28*(1-f*0.6); }
    else if(d.kind==="circle"){ const g2=Math.min(1,f/0.25); r=d.r0+(d.r1-d.r0)*(1-(1-g2)*(1-g2)); a=f<0.82?1:Math.max(0,1-(f-0.82)/0.18); u.uFill.value=f; }
    else { u.uFill.value=d.fill; a=0.75+0.25*Math.sin(FX.time*(10+d.fill*26)); }
    if(d.fade>=0){ d.fade-=dt; a*=Math.max(0,d.fade/0.14); if(d.fade<=0) f=1; }
    u.uA.value=a; u.uTime.value=FX.time; d.mesh.scale.setScalar(Math.max(0.01,r));
    if(f>=1){ d.on=false; d.mesh.visible=false; }
  }
  for(let i=0;i<FX.flashes.length;i++){
    const fl=FX.flashes[i]; if(!fl.on) continue;
    fl.t+=dt; const f=fl.t/fl.life, e=1-(1-Math.min(1,f))*(1-Math.min(1,f));
    fl.mesh.scale.setScalar(fl.s0+(fl.s1-fl.s0)*e); fl.mat.opacity=Math.max(0,(1-f))*0.6;
    if(f>=1){ fl.on=false; fl.mesh.visible=false; }
  }
  const zk=Math.pow(Math.max(3,CAM.curDist||7)/7,0.6);
  for(let i=0;i<FX.nums.length;i++){
    const n=FX.nums[i]; if(!n.on) continue;
    n.t+=dt; const f=n.t/n.life;
    const pop=n.t<0.07?0.45+n.t/0.07*0.95:1.4-0.4*Math.min(1,(n.t-0.07)/0.12);
    n.s.position.y+=n.vy*dt; n.s.position.x+=n.vx*dt; n.vy*=Math.max(0,1-3*dt);
    n.mat.opacity=f<0.6?1:Math.max(0,1-(f-0.6)/0.4);
    const sc=n.base*pop*zk; n.s.scale.set(sc,sc*0.5,1);
    if(f>=1){ n.on=false; n.s.visible=false; }
  }
}

/* ---------- projectiles (instanced: arrows 2 draw calls, bolts 1) ---------- */
const SHOTS=[]; let ARW_SHAFT=null, ARW_HEAD=null, BOLT_INST=null;
function initProjectiles(){
  const sg=new THREE.CylinderGeometry(0.022,0.022,0.72,5); sg.rotateX(Math.PI/2);
  const hg=new THREE.ConeGeometry(0.06,0.18,6); hg.rotateX(Math.PI/2); hg.translate(0,0,0.42);
  ARW_SHAFT=new THREE.InstancedMesh(sg, new THREE.MeshBasicMaterial({ color:0xf3e2b8 }), 48);
  ARW_HEAD=new THREE.InstancedMesh(hg, new THREE.MeshBasicMaterial({ color:0xeaf6ff }), 48);
  BOLT_INST=new THREE.InstancedMesh(geo.sphereL, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95, depthWrite:false, blending:THREE.AdditiveBlending }), 24);
  BOLT_INST.setColorAt(0,_fxCol.setRGB(1,1,1));
  [ARW_SHAFT,ARW_HEAD,BOLT_INST].forEach(m=>{ m.count=0; m.frustumCulled=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); });
  BOLT_INST.renderOrder=12;
  for(let i=0;i<48;i++) SHOTS.push({ on:false, kind:0, x:0,y:0,z:0, vx:0,vz:0, spd:0, life:0, age:0, dmg:0, knock:0, target:null, hits:new Array(12), hitN:0 });
}
const SHOT_COL=[0xfff4c8, 0xb58cff, 0x8fd8ff, 0xd8ff7a];
function fireShot(kind, yawOff, dmg, spd, target){
  if(kind===true) kind=1; else if(kind===false) kind=0;
  let s=null; for(let i=0;i<SHOTS.length;i++) if(!SHOTS[i].on){ s=SHOTS[i]; break; }
  if(!s) return null;
  const P=G.p, yaw=P.yaw+(yawOff||0);
  s.on=true; s.kind=kind; s.x=P.x+Math.sin(yaw)*0.55; s.z=P.z+Math.cos(yaw)*0.55; s.y=(P.y||0)+(kind===1||kind===2?1.05:0.95);
  s.vx=Math.sin(yaw)*spd; s.vz=Math.cos(yaw)*spd; s.spd=spd; s.dmg=dmg; s.age=0; s.hitN=0;
  s.life=kind===0?0.7:(kind===3?1.0:1.2); s.target=target||null; s.knock=kind===3?6:(kind===1?3.6:kind===2?3:2.4);
  FX.add.emit(s.x,s.y,s.z, 0,0,0, 0.1, 0.25, kind===3?0.9:0.55, SHOT_COL[kind], 1, 0,0,0);
  return s;
}
function updateShots(dt){
  let na=0, nb=0;
  for(let i=0;i<SHOTS.length;i++){
    const s=SHOTS[i]; if(!s.on) continue;
    s.age+=dt; s.life-=dt;
    if(s.target && !s.target.dead && (s.kind===1||s.kind===2)){
      const dx=s.target.x-s.x, dz=s.target.z-s.z, d=Math.hypot(dx,dz)||1, k=Math.min(1,(s.kind===2?7:2.6)*dt);
      s.vx+=(dx/d*s.spd-s.vx)*k; s.vz+=(dz/d*s.spd-s.vz)*k;
      const v=Math.hypot(s.vx,s.vz)||1; s.vx*=s.spd/v; s.vz*=s.spd/v;
    }
    const ox=s.x, oz=s.z; s.x+=s.vx*dt; s.z+=s.vz*dt;
    const col=SHOT_COL[s.kind];
    if(s.kind===0){
      for(let k=0;k<2;k++){ const f=k*0.5; FX.add.emit(ox+(s.x-ox)*f, s.y, oz+(s.z-oz)*f, s.vx*0.12,0,s.vz*0.12, 0.13, 0.035, 0.01, col, 0.55, 6, 0, 0.12); }
    } else if(s.kind===3){
      for(let k=0;k<3;k++){ const f=k/3; FX.add.emit(ox+(s.x-ox)*f, s.y, oz+(s.z-oz)*f, s.vx*0.1,0,s.vz*0.1, 0.22, 0.11, 0.02, col, 0.8, 5, 0, 0.1); }
      FX.add.emit(s.x,s.y,s.z,(Math.random()-0.5)*3,(Math.random()-0.2)*3,(Math.random()-0.5)*3,0.3,0.05,0.01,0xffffff,1,3,4,0.05);
    } else {
      FX.add.emit(s.x,s.y,s.z,(Math.random()-0.5)*0.6,(Math.random()-0.5)*0.6,(Math.random()-0.5)*0.6, 0.24, 0.2, 0.04, col, 0.85, 2, 0, 0);
      FX.add.emit(ox,s.y,oz,(Math.random()-0.5)*1.6,(Math.random()-0.3)*1.6,(Math.random()-0.5)*1.6, 0.42, 0.05, 0.01, 0xfff0ff, 1, 2, -1, 0.04);
    }
    let dead=s.life<=0;
    for(let j=0;j<G.enemies.length && !dead;j++){
      const e=G.enemies[j]; if(e.dead) continue;
      const dx=e.x-s.x, dz=e.z-s.z, rr=e.r+0.3; if(dx*dx+dz*dz>rr*rr) continue;
      if(s.kind===3){ let seen=false; for(let h=0;h<s.hitN;h++) if(s.hits[h]===e){ seen=true; break; } if(seen) continue; if(s.hitN<12) s.hits[s.hitN++]=e; }
      const v=Math.hypot(s.vx,s.vz)||1, nx=s.vx/v, nz=s.vz/v;
      const crit=hitEnemy(e, s.dmg, nx, nz, s.knock, { power:s.kind===3?1:0.5, col:s.kind===0?0xfff2b0:col, pop:s.kind===3?2.6:0 });
      if(s.kind===1||s.kind===2){ fxBurst(s.x,s.y,s.z,col,12,4,0.35,0.1,3); spawnFlash(s.x,s.y,s.z,0.2,0.9,col,0.16); }
      hitStop(s.kind===3?0.05:0.03*(crit?1.5:1)); addShake(s.kind===3?0.32:0.16*(crit?1.4:1));
      if(s.kind!==3) dead=true;
    }
    if(dead){ s.on=false; if(s.life<=0 && (s.kind===1||s.kind===2)) fxBurst(s.x,s.y,s.z,col,6,2,0.3,0.08,1); continue; }
    _dummy.position.set(s.x,s.y,s.z);
    if(s.kind===0||s.kind===3){
      _dummy.rotation.set(0,Math.atan2(s.vx,s.vz),0); _dummy.scale.setScalar(s.kind===3?1.7:1); _dummy.updateMatrix();
      ARW_SHAFT.setMatrixAt(na,_dummy.matrix); ARW_HEAD.setMatrixAt(na,_dummy.matrix); na++;
    } else {
      _dummy.rotation.set(0,0,0); _dummy.scale.setScalar((s.kind===2?0.24:0.32)*(1+0.12*Math.sin(s.age*40))); _dummy.updateMatrix();
      BOLT_INST.setMatrixAt(nb,_dummy.matrix); BOLT_INST.setColorAt(nb,_fxCol.setHex(col)); nb++;
    }
  }
  ARW_SHAFT.count=na; ARW_HEAD.count=na; BOLT_INST.count=nb;
  if(na){ ARW_SHAFT.instanceMatrix.needsUpdate=true; ARW_HEAD.instanceMatrix.needsUpdate=true; }
  if(nb){ BOLT_INST.instanceMatrix.needsUpdate=true; if(BOLT_INST.instanceColor) BOLT_INST.instanceColor.needsUpdate=true; }
}

/* ---------- drops: coins + exp orbs pop out, then home into the player ---------- */
const DROPS=[]; let COIN_INST=null, ORB_INST=null;
function initDrops(){
  const cg=new THREE.CylinderGeometry(0.12,0.12,0.035,14);
  COIN_INST=new THREE.InstancedMesh(cg, new THREE.MeshToonMaterial({ color:0xffd24a, gradientMap, emissive:0xb07a10, emissiveIntensity:0.45 }), 64);
  ORB_INST=new THREE.InstancedMesh(geo.sphereL, new THREE.MeshBasicMaterial({ color:0x8ff7ff }), 48);
  [COIN_INST,ORB_INST].forEach(m=>{ m.count=0; m.frustumCulled=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m); });
  for(let i=0;i<112;i++) DROPS.push({ on:false, kind:0, x:0,y:0,z:0, vx:0,vy:0,vz:0, t:0, wait:0, spd:0, val:0 });
}
function spawnDrops(x,z,nc,no,boss){
  let c=0,o=0;
  for(let i=0;i<DROPS.length && (c<nc||o<no);i++){
    const d=DROPS[i]; if(d.on) continue;
    d.kind=c<nc?0:1; if(d.kind===0) c++; else o++;
    const a=Math.random()*6.2832, s=1.6+Math.random()*2.4*(boss?1.5:1);
    d.on=true; d.x=x; d.y=0.6; d.z=z; d.vx=Math.sin(a)*s; d.vz=Math.cos(a)*s; d.vy=4.5+Math.random()*2.5;
    d.t=0; d.wait=0.55+Math.random()*0.25; d.spd=0; d.val=d.kind===0?(boss?3:1):(boss?12:5);
  }
}
function updateDrops(dt){
  let nc=0, no=0; const P=G.p, now=FX.time;
  for(let i=0;i<DROPS.length;i++){
    const d=DROPS[i]; if(!d.on) continue;
    d.t+=dt;
    if(d.t<d.wait || P.dead){
      d.vy-=18*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt;
      if(d.y<0.14){ d.y=0.14; d.vy=Math.abs(d.vy)*0.42; d.vx*=0.55; d.vz*=0.55; }
    } else {
      const dx=P.x-d.x, dy=(P.y||0)+0.9-d.y, dz=P.z-d.z, dist=Math.hypot(dx,dy,dz)||0.001;
      d.spd=Math.min(24, d.spd+42*dt); const st=Math.min(dist, d.spd*dt);
      d.x+=dx/dist*st; d.y+=dy/dist*st; d.z+=dz/dist*st;
      if(d.kind===1) FX.add.emit(d.x,d.y,d.z,0,0,0,0.16,0.1,0.02,0x8ff7ff,0.8,0,0,0);
      if(dist<0.4){
        d.on=false;
        if(G.save){ if(d.kind===0) G.save.gold+=d.val; else G.save.xp+=d.val; G.saveDirty=true; }
        FX.add.emit(P.x,(P.y||0)+1.0,P.z,0,1,0,0.22,0.15,0.5,d.kind===0?0xffe070:0x8ff7ff,1,0,0,0);
        sfx(d.kind===0?"coin":"orb");
        continue;
      }
    }
    _dummy.position.set(d.x,d.y+(d.t<d.wait?0:Math.sin(now*12+i)*0.03),d.z);
    if(d.kind===0){ _dummy.rotation.set(Math.PI/2, now*7+i, 0); _dummy.scale.setScalar(1); _dummy.updateMatrix(); COIN_INST.setMatrixAt(nc++, _dummy.matrix); }
    else { _dummy.rotation.set(0,0,0); _dummy.scale.setScalar(0.17+0.03*Math.sin(now*10+i)); _dummy.updateMatrix(); ORB_INST.setMatrixAt(no++, _dummy.matrix); }
  }
  COIN_INST.count=nc; ORB_INST.count=no;
  if(nc) COIN_INST.instanceMatrix.needsUpdate=true; if(no) ORB_INST.instanceMatrix.needsUpdate=true;
}

/* ---------- synthesized SFX (WebAudio, no assets) ---------- */
const SFX={ ctx:null, out:null, noise:null, muted:false, last:Object.create(null) };
try{ SFX.muted=localStorage.getItem("MengYu_mute")==="1"; }catch(e){}
function sfxInit(){
  if(SFX.ctx){ if(SFX.ctx.state==="suspended") SFX.ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SFX.ctx=new AC(); }catch(e){ return; }
  const c=SFX.ctx; SFX.out=c.createGain(); SFX.out.gain.value=0.5;
  const comp=c.createDynamicsCompressor(); SFX.out.connect(comp); comp.connect(c.destination);
  const len=(c.sampleRate*0.8)|0, b=c.createBuffer(1,len,c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  SFX.noise=b;
}
function _env(g,t,a,peak,dur){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
function _tone(type,f0,f1,dur,vol,delay){
  const c=SFX.ctx, t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  _env(g,t,0.005,vol,dur); o.connect(g); g.connect(SFX.out); o.start(t); o.stop(t+dur+0.03);
}
function _noise(ft,f0,f1,q,dur,vol,delay){
  const c=SFX.ctx, t=c.currentTime+(delay||0), s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=SFX.noise; f.type=ft; f.Q.value=q; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  _env(g,t,0.004,vol,dur); s.connect(f); f.connect(g); g.connect(SFX.out); s.start(t, Math.random()*0.4); s.stop(t+dur+0.03);
}
function sfx(name){
  if(SFX.muted||!SFX.ctx||SFX.ctx.state!=="running") return;
  const now=SFX.ctx.currentTime; if(now-(SFX.last[name]||0)<0.045) return; SFX.last[name]=now;
  try{
  switch(name){
    case "swing": _noise("bandpass",2600,520,1.3,0.14,0.32); break;
    case "hit": _tone("sine",190,55,0.12,0.55); _noise("highpass",3200,1500,0.7,0.06,0.28); break;
    case "crit": _tone("sine",230,48,0.17,0.7); _noise("highpass",4200,1800,0.7,0.08,0.36); _tone("triangle",1250,1900,0.09,0.16,0.01); break;
    case "draw": _noise("bandpass",3600,1800,2,0.06,0.2); _tone("triangle",820,320,0.07,0.15); break;
    case "cast": _tone("sine",420,980,0.14,0.2); _tone("triangle",840,1960,0.12,0.07,0.02); break;
    case "boom": _noise("lowpass",1500,90,0.8,0.55,0.75); _tone("sine",110,38,0.45,0.6); break;
    case "charge": _tone("sine",300,900,0.4,0.13); _tone("triangle",600,1800,0.4,0.05); break;
    case "spin": _noise("bandpass",900,2800,1.5,0.5,0.26); break;
    case "dash": _noise("bandpass",600,2800,1.2,0.22,0.36); break;
    case "dodge": _noise("bandpass",1300,350,1.2,0.2,0.28); break;
    case "hurt": _tone("square",320,110,0.16,0.14); _noise("lowpass",900,200,1,0.12,0.3); break;
    case "pop": _tone("sine",720,170,0.15,0.35); _noise("bandpass",1800,600,1,0.1,0.25); break;
    case "coin": _tone("sine",1318,1318,0.06,0.12); _tone("sine",1760,1760,0.1,0.12,0.06); break;
    case "orb": _tone("sine",880,1320,0.1,0.08); break;
    case "windup": _tone("sine",180,420,0.35,0.07); break;
    case "slam": _noise("lowpass",900,80,0.8,0.4,0.6); _tone("sine",80,35,0.35,0.5); break;
    case "volley": _noise("bandpass",3200,1500,1.5,0.12,0.3); _tone("triangle",900,300,0.1,0.14); break;
    case "pierce": _noise("bandpass",1500,4500,1.2,0.25,0.35); _tone("sawtooth",300,900,0.2,0.07); break;

function qst(id){ return (G.save.quests[id]||{st:"locked",pr:0}); }
function tracked(){
  let ready=null, act=null, av=null;
  QUESTS.forEach(q=>{ const s=qst(q.id).st; if(s==="ready"&&!ready)ready=q; if(s==="active"&&!act)act=q; if(s==="avail"&&!av)av=q; });
  return ready||act||av;
}
function progressText(){
  const q=tracked(); if(!q) return G.save&&G.save.storyDone?"蚀雾暂时被推退了。在青岚镇走走吧。":"去古井广场找镇长苏晚晴。";
  const e=qst(q.id);
  const names={mayor:"苏晚晴",herb:"叶青",guard:"石川"};
  if(e.st==="avail") return "与「"+(names[q.giver]||"")+"」交谈。";
  if(e.st==="ready") return "向「"+(names[q.turn]||"")+"」复命。";
  if(q.type==="talk") return "去找「"+(names[q.target]||"")+"」。";
  if(q.type==="kill") return "击败蚀斑史莱姆  "+e.pr+" / "+q.count;
  if(q.type==="collect") return "收集蚀核碎片  "+e.pr+" / "+q.count;
  return q.journal;
}
function markerFor(npcId){
  let turn=false, av=false, talk=false;
  QUESTS.forEach(q=>{
    const s=qst(q.id).st;
    if(s==="ready"&&q.turn===npcId) turn=true;
    if(s==="avail"&&q.giver===npcId) av=true;
    if(s==="active"&&q.type==="talk"&&q.target===npcId) talk=true;
  });
  if(turn||talk) return "?";
  if(av) return "!";
  return "";

function makeMarker(){
  const c=document.createElement("canvas"); c.width=128;c.height=128;
  const ctx=c.getContext("2d");
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  sp.scale.set(0.7,0.7,1);
  sp._set=function(ch){
    ctx.clearRect(0,0,128,128);
    if(!ch){ sp.visible=false; return; }
    sp.visible=true;
    ctx.font="bold 96px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=10; ctx.strokeStyle="#3a2410"; ctx.strokeText(ch,64,72);
    ctx.fillStyle=ch==="!"?"#ffd84a":"#6be88a"; ctx.fillText(ch,64,72);
    tex.needsUpdate=true;
  };
  return sp;
}
function refreshMarkers(){

function notifyKill(){
  G.save.kills++;
  QUESTS.forEach(q=>{
    const e=qst(q.id);
    if(e.st==="active"&&q.type==="kill"){ e.pr=Math.min(q.count,e.pr+1); if(e.pr>=q.count) e.st="ready"; }
  });
  persist(G.save); refreshHUD();
}

      e.pr=Math.min(q.count,e.pr+1);

}

function inTownBounds(x,z){
  if(z>=TOWN_CFG.fieldZ){
    if(x<-17||x>17||z>46) return false;
    return true;
  }
  if(Math.abs(z-15.8)<0.7 && Math.abs(x)>1.8) return false; // stone gate pillars
  const g=TOWN.grid;
  if(!g){
    const r=Math.hypot(x-TOWN_CFG.fountainX, z-TOWN_CFG.fountainZ);
    return r<12;
  }
  const ix=Math.floor((x-g.ox)/g.cell), iz=Math.floor((z-g.oz)/g.cell);
  if(ix<0||iz<0||ix>=g.nx||iz>=g.nz) return false;
  return !!g.walk[iz*g.nx+ix];
}
function groundAt(x,z){
  if(z>=TOWN_CFG.fieldZ) return 0;
  const g=TOWN.grid; if(!g) return 0;
  const fx=(x-g.ox)/g.cell-0.5, fz=(z-g.oz)/g.cell-0.5;
  const ix=Math.floor(fx), iz=Math.floor(fz);
  if(ix<0||iz<0||ix>=g.nx-1||iz>=g.nz-1) return 0;
  const tx=fx-ix, tz=fz-iz;
  const h00=g.height[iz*g.nx+ix], h10=g.height[iz*g.nx+ix+1];

/* ---------- WoW-style third-person orbit camera ---------- */
const CAM={ yaw:0, pitch:22*Math.PI/180, dist:7.0, curDist:7.0, minD:2.6, maxD:15, minP:5*Math.PI/180, maxP:70*Math.PI/180,

const _camT=new THREE.Vector3(), _camP=new THREE.Vector3(), _camB=new THREE.Vector3();
function camClamp(){
  CAM.pitch=Math.min(CAM.maxP, Math.max(CAM.minP, CAM.pitch));
  CAM.dist=Math.min(CAM.maxD, Math.max(CAM.minD, CAM.dist));
  syncZoomUI();
}
function syncZoomUI(){
  const th=document.getElementById("zthumb"), fl=document.getElementById("zfill"), z=document.getElementById("zoom");
  if(!th||!z) return;
  const H=z.clientHeight||178, top=30, bot=H-30;
  const f=(CAM.dist-CAM.minD)/(CAM.maxD-CAM.minD); // 0 = near (bottom), 1 = far (top)
  const y=bot-(bot-top)*f;
  th.style.top=y+"px"; fl.style.height=((bot-top)*f)+"px";
}
function camReset(behindYaw){
  CAM.yaw=behindYaw||0; CAM.pitch=22*Math.PI/180; CAM.dist=CAM.curDist=7.0; camClamp();
}
// camera-collision against the authored town: march the town height grid from the look target to the camera
function gateBlocks(x,y,z){
  // procedural stone gate at z=15.8 (pillars, arch band, low side walls)
  const dz=Math.abs(z-15.8); if(dz>0.75) return false;
  const ax=Math.abs(x);
  if(ax>1.5 && ax<2.8 && y<3.2) return true;          // pillars
  if(ax<2.8 && y>2.5 && y<5.5) return true;           // arch band + keystone
  if(dz<0.4 && ax>=2.8 && ax<11.2 && y<1.45) return true; // side walls
  return false;
}
function camOcclusion(tx,ty,tz, px,py,pz){
  const g=TOWN.grid;
  const N=28; let hit=1;
  for(let i=2;i<=N;i++){
    const f=i/N, x=tx+(px-tx)*f, y=ty+(py-ty)*f, z=tz+(pz-tz)*f;
    if(gateBlocks(x,y,z)){ hit=Math.max(0.12,(i-1.5)/N); break; }
    if(!g || z>=TOWN_CFG.fieldZ+1) continue;
    const ix=Math.floor((x-g.ox)/g.cell), iz=Math.floor((z-g.oz)/g.cell);
    if(ix<0||iz<0||ix>=g.nx||iz>=g.nz) continue;
    const h=g.height[iz*g.nx+ix];
    if(h>0.5 && y<h+0.35){ hit=Math.max(0.12,(i-1.5)/N); break; }
  }
  return hit;
}
function updateCamera(dt, moving){
  const now=performance.now()/1000;
  // gentle WoW-like auto-follow: swing behind the hero while running, never while the player is steering the camera
  if(moving && !CAM.dragging && now-CAM.lastUser>1.6){
    let d=G.p.yaw-CAM.yaw; d=Math.atan2(Math.sin(d),Math.cos(d));
    if(Math.abs(d)<2.0) CAM.yaw+=d*(1-Math.exp(-0.7*dt));
  }
  const tx=G.p.x, ty=(G.p.y||0)+CAM.lookH, tz=G.p.z;
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch), fx=Math.sin(CAM.yaw), fz=Math.cos(CAM.yaw);
  const want=CAM.dist;
  const occ=camOcclusion(tx,ty,tz, tx-fx*cp*want, ty+sp*want, tz-fz*cp*want);
  const target=want*occ;
  // pull in fast when blocked, ease back out slowly
  CAM.curDist += (target-CAM.curDist)*(1-Math.exp((target<CAM.curDist?-18:-3.5)*dt));
  const D=CAM.curDist;
  let cx=tx-fx*cp*D, cy=ty+sp*D, cz=tz-fz*cp*D;
  const gy=groundAt(cx,cz)+0.25; if(cy<gy) cy=gy;
  _camP.set(cx,cy,cz);

  else _camB.lerp(_camP, 1-Math.exp(-22*dt));
  // trauma-style shake: smooth multi-sine noise, amplitude ~ trauma^2
  G.shake=Math.max(0,G.shake-dt*2.4);
  const sh=G.shake*G.shake, tt=now;
  const ox=(Math.sin(tt*61.3)+0.6*Math.sin(tt*37.1+1.7))*0.16*sh, oy=(Math.sin(tt*53.7+0.4)+0.6*Math.sin(tt*29.3+2.1))*0.13*sh;
  camera.position.set(_camB.x+ox, _camB.y+oy, _camB.z);
  _camT.set(tx+ox*0.5,ty+oy*0.5,tz);
  camera.lookAt(_camT);
}
function bindCameraInput(){
  const cv=$("c");

  cv.addEventListener("pointerdown", e=>{
    if(!active()) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    CAM.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(CAM.ptrs.size===2){ const a=[...CAM.ptrs.values()]; CAM.pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; CAM.dist0=CAM.dist; }
    CAM.dragging=true; CAM.lastUser=performance.now()/1000;
  });
  cv.addEventListener("pointermove", e=>{
    const pr=CAM.ptrs.get(e.pointerId); if(!pr) return;
    const dx=e.clientX-pr.x, dy=e.clientY-pr.y; pr.x=e.clientX; pr.y=e.clientY;
    if(CAM.ptrs.size>=2){
      const a=[...CAM.ptrs.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
      CAM.dist=CAM.dist0*CAM.pinch0/d;
    } else {
      const k=(e.pointerType==="mouse"?0.0055:0.0072);
      CAM.yaw-=dx*k; CAM.pitch+=dy*k*0.8;
    }
    camClamp(); CAM.lastUser=performance.now()/1000;
  });
  const end=e=>{
    CAM.ptrs.delete(e.pointerId);
    if(CAM.ptrs.size===1){ CAM.pinch0=0; }
    if(CAM.ptrs.size===0) CAM.dragging=false;
    CAM.lastUser=performance.now()/1000;
  };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("lostpointercapture", end);
  cv.addEventListener("wheel", e=>{ if(!active()) return; e.preventDefault(); CAM.dist*=Math.exp(e.deltaY*0.0012); camClamp(); CAM.lastUser=performance.now()/1000; }, {passive:false});
  cv.addEventListener("contextmenu", e=>e.preventDefault());
  // on-screen zoom slider (top = far, bottom = near), synced with pinch / wheel
  const z=$("zoom");
  function fromY(cy){
    const r=z.getBoundingClientRect(), top=r.top+30, bot=r.bottom-30;
    const f=Math.min(1,Math.max(0,(bot-cy)/(bot-top)));
    CAM.dist=CAM.minD+(CAM.maxD-CAM.minD)*f; camClamp(); CAM.lastUser=performance.now()/1000;
  }
  let zon=false;
  z.addEventListener("pointerdown", e=>{ e.preventDefault(); e.stopPropagation(); zon=true; try{ z.setPointerCapture(e.pointerId); }catch(_){} fromY(e.clientY); });
  z.addEventListener("pointermove", e=>{ if(zon) fromY(e.clientY); });
  const zend=()=>{ zon=false; };
  z.addEventListener("pointerup", zend); z.addEventListener("pointercancel", zend);
  syncZoomUI();
}
function nearestEnemy(maxD){

function faceNearest(maxD){

function updateEnemy(e, dt, P){

  G.npcs.forEach(n=>{ const d=Math.hypot(n.x-P.x,n.z-P.z); if(d<2.6&&d<best){best=d;G.near=n;} });
  const tk=$("talk"), want=(G.near && G.mode==="play")?"block":"none"; if(tk.style.display!==want) tk.style.display=want;
  updateCamera(dt, moved && P.dodgeT<=0);
  if((refreshHUD._acc=(refreshHUD._acc||0)+dt)>0.25){ refreshHUD._acc=0; refreshHUD(); }
  if(G.saveDirty && (G._saveAcc=(G._saveAcc||0)+dt)>2){ G._saveAcc=0; G.saveDirty=false; persist(G.save); }
}
function damagePlayer(amt, sx, sz){
  const P=G.p; if(P.dead||G.mode!=="play") return;
  if(P.invT>0||P.dodgeT>0||P.dashT>0){ if(P.dodgeT>0||P.dashT>0){ spawnNum(P.x,(P.y||0)+1.9,P.z,"闪避",3); sfx("orb"); } return; }
  amt=Math.max(1,Math.round(amt*(0.9+Math.random()*0.2)));
  P.hp=Math.max(0,P.hp-amt); P.invT=0.75; P.hurtT=0.16; P.atkT=0; P.lungeT=0; G.comboQueued=false;
  let dx=0, dz=1;
  if(sx!=null){ dx=P.x-sx; dz=P.z-sz; const d=Math.hypot(dx,dz)||1; dx/=d; dz/=d; tryMove(dx*0.5, dz*0.5); }
  HUDFX.vig=1;
  const b=$("bars"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  spawnNum(P.x,(P.y||0)+1.85,P.z,amt,2);
  hitSpark(P.x-dx*0.3,(P.y||0)+0.9,P.z-dz*0.3,dx,dz,0xff6a6a,0.6);
  addShake(0.45); hitStop(0.05); sfx("hurt");
  refreshHUD();
  if(P.hp<=0){ P.dead=true; setTimeout(()=>{ if(G.p.dead) $("over").style.display="flex"; }, 700); }
}
function resurrect(){
  const c=CLASSES[G.classId], P=G.p;
  P.hp=c.hp; P.mp=c.mp; P.dead=false; P.x=TOWN_CFG.spawnX; P.z=TOWN_CFG.spawnZ; P.yaw=0;
  P.invT=1.2; P.dodgeT=0; P.dashT=0; P.spinT=0; P.atkT=0; P.hurtT=0; LATER.length=0;
  camReset(0); updateCamera._init=false;
  if(G.player){ G.player.scale.set(1,1,1); G.player.visible=true; }
  $("over").style.display="none"; refreshHUD();
}
function toTitle(){
  G.mode="select"; $("playHud").style.display="none"; $("select").style.display="flex"; $("over").style.display="none";
}

function bindInput(){
  const joy=$("joy"), knob=$("knob");
  function setFrom(cx,cy,rect){
    let x=(cx-rect.left-rect.width/2)/(rect.width*0.5);
    let y=(cy-rect.top-rect.height/2)/(rect.height*0.5);
    const l=Math.hypot(x,y); if(l>1){ x/=l;y/=l; }
    G.joy.x=x; G.joy.y=-y; G.joy.on=true;
    knob.style.transform="translate("+(x*50)+"px,"+(y*50)+"px)";
  }
  function endJoy(){ G.joy.x=G.joy.y=0; G.joy.on=false; knob.style.transform=""; }
  function pid(e){ return e.pointerId!=null?e.pointerId:1; }
  joy.addEventListener("pointerdown", e=>{ joy.setPointerCapture(pid(e)); setFrom(e.clientX,e.clientY,joy.getBoundingClientRect()); e.preventDefault(); });
  joy.addEventListener("pointermove", e=>{ if(G.joy.on) setFrom(e.clientX,e.clientY,joy.getBoundingClientRect()); });
  joy.addEventListener("pointerup", endJoy);
  joy.addEventListener("pointercancel", endJoy);
  document.addEventListener("pointerdown", sfxInit, true);
  document.addEventListener("keydown", sfxInit, true);
  $("atk").addEventListener("pointerdown", e=>{ e.preventDefault(); tryAttack(); G.atkHeld=true; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>$("atk").addEventListener(ev, ()=>G.atkHeld=false));
  $("sk1").addEventListener("pointerdown", e=>{ e.preventDefault(); trySkill(1); });
  $("sk2").addEventListener("pointerdown", e=>{ e.preventDefault(); trySkill(2); });
  $("dg").addEventListener("pointerdown", e=>{ e.preventDefault(); tryDodge(); });
  const mb=$("mute"), syncMute=()=>{ mb.classList.toggle("off",SFX.muted); mb.textContent=SFX.muted?"静音":"音效"; };
  syncMute();
  mb.addEventListener("click", ()=>{ SFX.muted=!SFX.muted; try{ localStorage.setItem("MengYu_mute",SFX.muted?"1":"0"); }catch(e){} syncMute(); if(!SFX.muted){ sfxInit(); sfx("coin"); } });
  $("talk").addEventListener("click", tryTalk);
  $("dlgNext").addEventListener("click", advDlg);
  $("goTown").addEventListener("click", resurrect);
  $("goTitle").addEventListener("click", toTitle);
  $("fs").addEventListener("click", ()=>{
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(document.fullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(req) req.call(el);
  });
  window.addEventListener("keydown", e=>{
    G.keys[e.code]=true;
    if(e.repeat) return;
    if(e.code==="Space"||e.code==="KeyJ"){ tryAttack(); G.atkHeld=true; }
    if(e.code==="KeyK"||e.code==="KeyQ") trySkill(1);
    if(e.code==="KeyL"||e.code==="KeyR") trySkill(2);
    if(e.code==="ShiftLeft"||e.code==="ShiftRight"||e.code==="KeyI") tryDodge();
    if(e.code==="KeyE"||e.code==="KeyF") tryTalk();
  });
  window.addEventListener("keyup", e=>{ G.keys[e.code]=false; if(e.code==="Space"||e.code==="KeyJ") G.atkHeld=false; });
  document.addEventListener("touchmove", e=>{ if(e.target.closest&&e.target.closest("#select")) return; e.preventDefault(); }, {passive:false});
  document.addEventListener("gesturestart", e=>e.preventDefault());
  document.addEventListener("dblclick", e=>e.preventDefault());
}
function buildClassCards(){
  const wrap=$("cards"); wrap.innerHTML="";
  CLASS_ORDER.forEach(id=>{
    const d=CLASSES[id];
    const el=document.createElement("div");
    el.className="card"+(id==="swordsman"?" sel sw":"");
    el.dataset.id=id;
    el.innerHTML="<h3>"+d.name+"</h3><div class='en'>"+d.en+"</div><div class='st'>"+d.sub+"</div><p>"+d.desc+"</p><div>生命 "+d.hp+"　法力 "+d.mp+"</div>"+(d.rec?"<div class='rec'>推荐</div>":"");
    el.addEventListener("click", ()=>{
      G.classId=id;
      [...wrap.children].forEach(c=>c.className="card"+(c.dataset.id===id? (id==="swordsman"?" sel sw":" sel"):""));
    });
    wrap.appendChild(el);
  });
  $("btnGo").addEventListener("click", ()=>startAdventure(G.classId,true));
  const sv=loadSave();
  if(sv&&sv.hasSave){ $("btnCont").style.display="inline-block"; $("btnCont").addEventListener("click", ()=>{ G.save=sv; startAdventure(sv.classId||"swordsman", false); }); }
}

const _shV=new THREE.Vector3();
const G_DPR={max:1,cur:1,acc:0,frames:0,checks:0};
// adaptive resolution: drop render scale a little if the phone cannot hold ~45fps
function adaptDPR(dt){
  if(G_DPR.checks>=4) return;
  G_DPR.acc+=dt; G_DPR.frames++;
  if(G_DPR.acc>=2.5){
    const fps=G_DPR.frames/G_DPR.acc; G_DPR.acc=0; G_DPR.frames=0; G_DPR.checks++;
    if(fps<42 && G_DPR.cur>1.25){ G_DPR.cur=Math.max(1.25,G_DPR.cur-0.25); renderer.setPixelRatio(G_DPR.cur); renderer.setSize(innerWidth,innerHeight,false); }
  }
}
function init(){
  if(!window.THREE){ document.body.insertAdjacentHTML("beforeend","<p style='padding:20px'>无法加载 Three.js。</p>"); return; }
  const canvas=$("c");
  renderer=new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:"high-performance" });
  const dpr=Math.min(window.devicePixelRatio||1, isMobile?2:2); G_DPR.max=dpr; G_DPR.cur=dpr;
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  // bright, saturated illustration look: tunable lighting rig (?look={"exp":1.1,...} for testing)
  const LOOK=Object.assign({ tm:"none", exp:1.0, hemi:1.0, sun:1.7, rim:0.3, fogN:38, fogF:150 },
    (()=>{ try{ return JSON.parse(new URLSearchParams(location.search).get("look")||"{}"); }catch(e){ return {}; } })());
  renderer.toneMapping= LOOK.tm==="none"?THREE.NoToneMapping : LOOK.tm==="agx"?THREE.AgXToneMapping : LOOK.tm==="aces"?THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  window.__LOOK=LOOK;
  renderer.toneMappingExposure=LOOK.exp;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xd9ecf9, LOOK.fogN, LOOK.fogF);
  camera=new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.15, 480);
  camera.position.set(10.5, 9.5, -13);
  clock=new THREE.Clock();
  gradientMap=makeGradientMap();
  FX_init();

  // sky-blue fill from above, warm grass bounce from below, warm key sun
  const hemi=new THREE.HemisphereLight(0xdcefff, 0xc8dca0, LOOK.hemi); scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff0d6, LOOK.sun); sun.position.set(14,18,7); scene.add(sun);
  sun.castShadow=true;
  const ss=isMobile?1024:2048;
  sun.shadow.mapSize.set(ss,ss);
  sun.shadow.camera.near=1; sun.shadow.camera.far=70;
  sun.shadow.camera.left=-16; sun.shadow.camera.right=16; scene.add(sun.target); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.02;
  sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
  sun.shadow.bias=-0.0008;
  const rim=new THREE.DirectionalLight(0xd8ecff, LOOK.rim); rim.position.set(-10,8,-12); scene.add(rim);

  buildWorld();
  spawnNpcVisuals();
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2, r=3+Math.random()*8;
    spawnSlime(Math.sin(a)*r, 32+Math.cos(a)*r*0.5, false);
  }
  camera.lookAt(0,0.6,3);
  bindInput();
  bindCameraInput();
  buildClassCards();
  window.__mengyu={ G, GLB, TOWN, TOWN_CFG, CAM, groundAt, inTownBounds, startAdventure, tryAttack, trySkill, tryDodge, damagePlayer, hitEnemy, spawnSlime, FX, SFX, SHOTS, DROPS, LATER, camClamp, get camera(){ return camera; }, get renderer(){ return renderer; } };
  loadCharacterModels(()=>{ upgradeVisuals(); try{ cardThumbs(); }catch(e){ console.warn('thumbs', e); } });
  window.addEventListener("resize", ()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    if(G.mode==="play") setPlayFov(); syncZoomUI();
    renderer.setSize(innerWidth, innerHeight, false);
  });

  if(shot==="select"){ applyShotCamera(); }
  else if(shot==="play"){ startAdventure("swordsman", true); }
  else if(shot==="playfield"){ startAdventure("swordsman", true); G.p.x=0; G.p.z=26; }
  else if(shot==="town"||shot==="field"||shot==="combat"){ startAdventure("swordsman", true); applyShotCamera(); }

  function loop(){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05, clock.getDelta())*(G.timeScale==null?1:G.timeScale);
    update(dt);
    adaptDPR(dt);
    { // keep the tight, sharp shadow box centred on where the camera looks
      let fx, fz;
      if(G.mode==="play" && !G.freezeCam){ fx=G.p.x+Math.sin(CAM.yaw)*7; fz=G.p.z+Math.cos(CAM.yaw)*7; }
      else { const dir=camera.getWorldDirection(_shV); const t=dir.y<-0.05? Math.min(40,-camera.position.y/dir.y) : 12;
        fx=camera.position.x+dir.x*t; fz=camera.position.z+dir.z*t; }
      sun.position.set(fx+14,18,fz+7); sun.target.position.set(fx,0,fz); sun.target.updateMatrixWorld(); }
    if(G.atkHeld) tryAttack();
    if(G.sky) G.sky.position.set(camera.position.x, 0, camera.position.z);
    renderer.render(scene, camera);
    if(!loop._ready){ loop._ready=1; document.documentElement.setAttribute("data-ready","1"); document.title="ready"; }
  }
  loop();
}
init();
})();

</script>
