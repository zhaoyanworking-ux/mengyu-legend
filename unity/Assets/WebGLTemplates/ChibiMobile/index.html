<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #7ec8f5;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas {
      width: 100%; height: 100%; display: block;
      touch-action: none; outline: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(#7ec8f5, #c8e8ff 55%, #b8e89a);
      pointer-events: none;
    }
    #loading h1 { font-size: 28px; margin: 0 0 8px; color: #fff3c0; text-shadow: 0 2px 0 #3a6aaa; }
    #bar { width: 220px; height: 10px; background: rgba(255,255,255,.35); border-radius: 8px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #ffd36a; }
    #fs {
      position: fixed; right: 12px; top: 12px; z-index: 5;
      padding: 8px 12px; border: 0; border-radius: 16px;
      background: rgba(255,255,255,.85); color: #335; font-size: 14px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>萌域传说</h1>
      <div>正在进入青岚镇…</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <button id="fs" type="button">全屏</button>
  </div>
  <script src="{{{ LOADER_FILENAME }}}"></script>
  <script>
    // 阻止 Android Chrome 下拉刷新、双击缩放与滚动
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    var canvas = document.querySelector('#unity-canvas');
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var cfg = {
      dataUrl: "{{{ DATA_FILENAME }}}",
      frameworkUrl: "{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: "{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: dpr,
      matchWebGLToCanvasSize: true
    };
    createUnityInstance(canvas, cfg, function (p) {
      document.getElementById('fill').style.width = (p * 100) + '%';
    }).then(function (instance) {
      document.getElementById('loading').style.display = 'none';
      window.unityInstance = instance;
    }).catch(function (err) { console.error(err); });

    document.getElementById('fs').addEventListener('click', function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (document.fullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (req) req.call(el);
    });
  </script>
</body>
</html>
